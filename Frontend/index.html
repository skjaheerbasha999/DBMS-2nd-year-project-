<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrackFlow — Software Project & Issue Tracking System</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- React 18, Babel & Three.js CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    /* ============================================================
       DESIGN SYSTEM TOKENS & BASE STYLES
       ============================================================ */
    :root {
      --bg-base: #020817;
      --bg-surface: #0f172a;
      --bg-surface-2: #1e293b;
      --bg-glass: rgba(15, 23, 42, 0.85);
      --bg-card: rgba(15, 23, 42, 0.9);

      --primary: #38bdf8;
      --primary-dark: #0ea5e9;
      --primary-glow: rgba(56, 189, 248, 0.25);

      --secondary: #818cf8;
      --secondary-dark: #6366f1;

      --success: #34d399;
      --success-bg: rgba(52, 211, 153, 0.12);
      --warning: #fbbf24;
      --warning-bg: rgba(251, 191, 36, 0.12);
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.12);

      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --border: rgba(148, 163, 184, 0.15);
      --border-light: rgba(148, 163, 184, 0.08);
      --border-glow: rgba(56, 189, 248, 0.35);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 20px;
      --radius-full: 9999px;

      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-surface); }
    ::-webkit-scrollbar-thumb { background: var(--bg-surface-2); border-radius: var(--radius-full); }

    /* Utility & Cards */
    .glass {
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      border-color: var(--border-glow);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-light);
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      font-family: inherit;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary-dark), var(--secondary-dark));
      color: white;
      box-shadow: 0 4px 15px var(--primary-glow);
    }
    .btn-primary:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: var(--bg-surface-2);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.3);
    }
    .btn-danger:hover {
      background: rgba(248, 113, 113, 0.25);
    }
    .btn-sm {
      padding: 5px 10px;
      font-size: 0.78rem;
      border-radius: var(--radius-sm);
    }

    /* Form Controls */
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 14px;
      background: rgba(2, 8, 23, 0.7);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      font-family: var(--font-mono);
    }
    .badge-open { background: rgba(96, 165, 250, 0.14); color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.3); }
    .badge-in-progress { background: rgba(251, 191, 36, 0.14); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
    .badge-resolved { background: rgba(52, 211, 153, 0.14); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
    .badge-closed { background: rgba(100, 116, 139, 0.14); color: #94a3b8; border: 1px solid rgba(100, 116, 139, 0.3); }
    
    .badge-low { background: rgba(52, 211, 153, 0.12); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.25); }
    .badge-medium { background: rgba(251, 191, 36, 0.12); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.25); }
    .badge-high { background: rgba(248, 113, 113, 0.12); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.25); }

    /* Tables */
    .table-container {
      width: 100%;
      overflow-x: auto;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      text-align: left;
    }
    th {
      background: var(--bg-surface-2);
      padding: 12px 16px;
      font-weight: 600;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-light);
      color: var(--text-primary);
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    /* Layout Structure */
    .app-layout {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 250px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
      text-decoration: none;
      padding: 0 8px;
    }
    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-item:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
    }
    .nav-item.active {
      color: white;
      background: linear-gradient(135deg, var(--primary-dark), var(--secondary-dark));
      font-weight: 600;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-base);
    }
    .top-header {
      height: 64px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .content-area {
      padding: 28px;
      flex: 1;
    }

    /* Metric Counters */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }
    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
    }
    .metric-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .metric-val {
      font-size: 2rem;
      font-weight: 800;
      margin-top: 6px;
      color: var(--text-primary);
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 8, 23, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 28px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React Application Source -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ============================================================
    // SVG ICONS
    // ============================================================
    const Icons = {
      Database: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>,
      Kanban: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><path d="M8 10v4"/><path d="M12 10v2"/><path d="M16 10v6"/></svg>,
      Bug: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="8" height="14" x="8" y="6" rx="4"/><path d="m19 7-3 2"/><path d="m5 7 3 2"/><path d="m19 19-3-2"/><path d="m5 19 3-2"/><path d="M20 13h-4"/><path d="M4 13h4"/></svg>,
      Users: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
      Report: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>,
      Plus: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
      Search: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
      Message: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>,
      X: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    };

    // ============================================================
    // INITIAL DBMS RELATIONAL SEED DATA
    // ============================================================
    const SEED_PROJECTS = [
      { projectId: 1, projectName: 'DBMS Query Optimizer', description: 'SQL query optimizer engine and transaction manager.', startDate: '2026-01-10', deadline: '2026-06-30', status: 'In Progress' },
      { projectId: 2, projectName: 'Cloud Storage Sync Gateway', description: 'Distributed blob storage file synchronization.', startDate: '2026-02-15', deadline: '2026-07-31', status: 'Open' },
      { projectId: 3, projectName: 'Payment API Integration', description: 'Stripe and PayPal gateway abstraction layer.', startDate: '2026-03-01', deadline: '2026-05-31', status: 'Resolved' }
    ];

    const SEED_MEMBERS = [
      { projectId: 1, userId: 1, role: 'Project Lead', joinedDate: '2026-01-10' },
      { projectId: 1, userId: 2, role: 'Backend Engineer', joinedDate: '2026-01-12' },
      { projectId: 1, userId: 3, role: 'Database Engineer', joinedDate: '2026-01-15' },
      { projectId: 2, userId: 2, role: 'Lead Developer', joinedDate: '2026-02-15' },
      { projectId: 2, userId: 4, role: 'Frontend Engineer', joinedDate: '2026-02-20' },
      { projectId: 3, userId: 3, role: 'Backend Specialist', joinedDate: '2026-03-01' }
    ];

    const SEED_ISSUES = [
      { issueId: 101, projectId: 1, title: 'Memory leak in B-Tree index node split', description: 'RAM spike when executing concurrent bulk insert queries.', assignedToId: 3, priority: 'High', status: 'In Progress', dueDate: '2026-04-10' },
      { issueId: 102, projectId: 1, title: 'FK cascade delete throws unhandled exception', description: 'Deleting parent record causes orphaned references.', assignedToId: 2, priority: 'Medium', status: 'Open', dueDate: '2026-04-15' },
      { issueId: 103, projectId: 2, title: 'OAuth2 Refresh token race condition', description: 'Background upload logs user out after token expiry.', assignedToId: 2, priority: 'High', status: 'Open', dueDate: '2026-04-08' },
      { issueId: 104, projectId: 3, title: 'Webhook signature validation fails on sandbox', description: 'HMAC SHA-256 header hash mismatch on staging.', assignedToId: 3, priority: 'Low', status: 'Resolved', dueDate: '2026-03-25' }
    ];

    const SEED_USERS = [
      { userId: 1, name: 'Lokesh Kumar', email: 'admin@trackflow.com', phone: '+91-9876543210', role: 'ADMIN' },
      { userId: 2, name: 'Priya Sharma', email: 'priya@trackflow.com', phone: '+91-9123456789', role: 'USER' },
      { userId: 3, name: 'Rahul Verma', email: 'rahul@trackflow.com', phone: '+91-9988776655', role: 'USER' },
      { userId: 4, name: 'Anita Rao', email: 'anita@trackflow.com', phone: '+91-9000112233', role: 'USER' }
    ];

    const SEED_COMMENTS = [
      { commentId: 1, issueId: 101, userId: 3, commentText: 'Reproduced issue with Valgrind profiling. Fix in progress.', createdDate: '2026-04-02 10:30' },
      { commentId: 2, issueId: 101, userId: 2, commentText: 'Merged patch to main branch. Re-testing memory allocation.', createdDate: '2026-04-03 14:15' }
    ];

    // ============================================================
    // MAIN APP COMPONENT
    // ============================================================
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      
      // Entities State
      const [projects, setProjects] = useState(SEED_PROJECTS);
      const [members, setMembers] = useState(SEED_MEMBERS);
      const [issues, setIssues] = useState(SEED_ISSUES);
      const [users, setUsers] = useState(SEED_USERS);
      const [comments, setComments] = useState(SEED_COMMENTS);

      // Selected items for Detail views
      const [selectedProjectId, setSelectedProjectId] = useState(1);
      const [selectedIssueId, setSelectedIssueId] = useState(101);

      // Search & Filter State for Issues
      const [issueSearch, setIssueSearch] = useState('');
      const [filterProject, setFilterProject] = useState('ALL');
      const [filterPriority, setFilterPriority] = useState('ALL');
      const [filterStatus, setFilterStatus] = useState('ALL');
      const [filterAssignee, setFilterAssignee] = useState('ALL');

      // Modals State
      const [showCreateProjectModal, setShowCreateProjectModal] = useState(false);
      const [showReportIssueModal, setShowReportIssueModal] = useState(false);
      const [showAddMemberModal, setShowAddMemberModal] = useState(false);
      const [showAddUserModal, setShowAddUserModal] = useState(false);

      // Form Inputs
      const [newProjName, setNewProjName] = useState('');
      const [newProjDesc, setNewProjDesc] = useState('');
      const [newProjStart, setNewProjStart] = useState('');
      const [newProjDeadline, setNewProjDeadline] = useState('');
      const [newProjStatus, setNewProjStatus] = useState('Open');

      const [newIssueProjId, setNewIssueProjId] = useState(1);
      const [newIssueTitle, setNewIssueTitle] = useState('');
      const [newIssueDesc, setNewIssueDesc] = useState('');
      const [newIssueAssignee, setNewIssueAssignee] = useState(2);
      const [newIssuePriority, setNewIssuePriority] = useState('Medium');
      const [newIssueStatus, setNewIssueStatus] = useState('Open');
      const [newIssueDueDate, setNewIssueDueDate] = useState('');

      const [newMemberUserId, setNewMemberUserId] = useState(2);
      const [newMemberRole, setNewMemberRole] = useState('Developer');

      const [newUserName, setNewUserName] = useState('');
      const [newUserEmail, setNewUserEmail] = useState('');
      const [newUserPhone, setNewUserPhone] = useState('');
      const [newUserRole, setNewUserRole] = useState('USER');

      const [newCommentText, setNewCommentText] = useState('');

      // Reports State
      const [reportProject, setReportProject] = useState('ALL');
      const [reportType, setReportType] = useState('SUMMARY');
      const [generatedReport, setGeneratedReport] = useState(true);

      // Helpers
      const getUserName = (id) => {
        const u = users.find(u => u.userId === parseInt(id));
        return u ? u.name : 'Unassigned';
      };
      const getProjectName = (id) => {
        const p = projects.find(p => p.projectId === parseInt(id));
        return p ? p.projectName : 'Unknown';
      };
      const getProjectMembersCount = (pId) => {
        return members.filter(m => m.projectId === pId).length;
      };
      const getProjectIssuesCount = (pId) => {
        return issues.filter(i => i.projectId === pId).length;
      };

      // CRUD Operations
      const handleCreateProject = (e) => {
        e.preventDefault();
        if (!newProjName.trim()) return;
        const newProj = {
          projectId: Date.now(),
          projectName: newProjName.trim(),
          description: newProjDesc,
          startDate: newProjStart || new Date().toISOString().split('T')[0],
          deadline: newProjDeadline || '2026-12-31',
          status: newProjStatus
        };
        setProjects([newProj, ...projects]);
        setShowCreateProjectModal(false);
        setNewProjName(''); setNewProjDesc('');
      };

      const handleReportIssue = (e) => {
        e.preventDefault();
        if (!newIssueTitle.trim()) return;
        const newIss = {
          issueId: Math.floor(100 + Math.random() * 900),
          projectId: parseInt(newIssueProjId),
          title: newIssueTitle.trim(),
          description: newIssueDesc,
          assignedToId: parseInt(newIssueAssignee),
          priority: newIssuePriority,
          status: newIssueStatus,
          dueDate: newIssueDueDate || '2026-12-31'
        };
        setIssues([newIss, ...issues]);
        setShowReportIssueModal(false);
        setNewIssueTitle(''); setNewIssueDesc('');
      };

      const handleAddMember = (e) => {
        e.preventDefault();
        const existing = members.find(m => m.projectId === selectedProjectId && m.userId === parseInt(newMemberUserId));
        if (existing) {
          alert('User is already a member of this project.');
          return;
        }
        const newM = {
          projectId: selectedProjectId,
          userId: parseInt(newMemberUserId),
          role: newMemberRole,
          joinedDate: new Date().toISOString().split('T')[0]
        };
        setMembers([...members, newM]);
        setShowAddMemberModal(false);
      };

      const handleAddUser = (e) => {
        e.preventDefault();
        if (!newUserName.trim() || !newUserEmail.trim()) return;
        const newU = {
          userId: Date.now(),
          name: newUserName.trim(),
          email: newUserEmail.trim(),
          phone: newUserPhone || '+91-9000000000',
          role: newUserRole
        };
        setUsers([...users, newU]);
        setShowAddUserModal(false);
        setNewUserName(''); setNewUserEmail('');
      };

      const handleAddComment = (e) => {
        e.preventDefault();
        if (!newCommentText.trim()) return;
        const newC = {
          commentId: Date.now(),
          issueId: selectedIssueId,
          userId: 1, // Current logged in user
          commentText: newCommentText.trim(),
          createdDate: new Date().toLocaleString()
        };
        setComments([...comments, newC]);
        setNewCommentText('');
      };

      const handleUpdateIssue = (field, val) => {
        setIssues(issues.map(i => {
          if (i.issueId === selectedIssueId) {
            return { ...i, [field]: val };
          }
          return i;
        }));
      };

      // Filtered Issues List
      const filteredIssues = issues.filter(i => {
        const matchesSearch = !issueSearch.trim() || 
          i.issueId.toString().includes(issueSearch.trim()) || 
          i.title.toLowerCase().includes(issueSearch.toLowerCase());

                              {users.map(u => (
                                <tr key={u.userId}>
                                  <td style={{ fontWeight: 600 }}>{u.name}</td>
                                  <td style={{ fontWeight: 700 }}>{issues.filter(i => i.assignedToId === u.userId).length}</td>
                                  <td style={{ fontWeight: 700, color: 'var(--success)' }}>
                                    {issues.filter(i => i.assignedToId === u.userId && (i.status === 'Resolved' || i.status === 'Closed')).length}
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>

                      {/* Project Report */}
                      <div className="card">
                        <div className="card-header">
                          <h3 className="card-title">Project Summary Report</h3>
                        </div>
                        <div className="table-container">
                          <table>
                            <thead>
                              <tr>
                                <th>Project Name</th>
                                <th>Total Issues</th>
                                <th>Open Issues</th>
                                <th>In Progress Issues</th>
                                <th>Resolved Issues</th>
                                <th>Deadline</th>
                                <th>Project Status</th>
                              </tr>
                            </thead>
                            <tbody>
                              {projects.map(p => {
                                const pIss = issues.filter(i => i.projectId === p.projectId);
                                return (
                                  <tr key={p.projectId}>
                                    <td style={{ fontWeight: 700 }}>{p.projectName}</td>
                                    <td style={{ fontWeight: 700 }}>{pIss.length}</td>
                                    <td>{pIss.filter(i => i.status === 'Open').length}</td>
                                    <td>{pIss.filter(i => i.status === 'In Progress').length}</td>
                                    <td style={{ color: 'var(--success)', fontWeight: 700 }}>{pIss.filter(i => i.status === 'Resolved' || i.status === 'Closed').length}</td>
                                    <td>{p.deadline}</td>
                                    <td><span className={`badge badge-${p.status.toLowerCase().replace(' ', '-')}`}>{p.status}</span></td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          </main>

          {/* CREATE PROJECT MODAL */}
          {showCreateProjectModal && (
            <div className="modal-overlay">
              <div className="modal-box">
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '16px' }}>
                  <h3 style={{ fontSize: '1.2rem', fontWeight: 700 }}>Create New Project</h3>
                  <button className="btn btn-secondary btn-sm" onClick={() => setShowCreateProjectModal(false)}><Icons.X /></button>
                </div>
                <form onSubmit={handleCreateProject}>
                  <div className="form-group">
                    <label className="form-label">Project Name *</label>
                    <input type="text" className="form-input" required value={newProjName} onChange={(e) => setNewProjName(e.target.value)} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Description</label>
                    <textarea className="form-textarea" rows="3" value={newProjDesc} onChange={(e) => setNewProjDesc(e.target.value)} />
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                    <div className="form-group">
                      <label className="form-label">Start Date</label>
                      <input type="date" className="form-input" value={newProjStart} onChange={(e) => setNewProjStart(e.target.value)} />
                    </div>
                    <div className="form-group">
                      <label className="form-label">Deadline</label>
                      <input type="date" className="form-input" value={newProjDeadline} onChange={(e) => setNewProjDeadline(e.target.value)} />
                    </div>
                  </div>
                  <div className="form-group">
                    <label className="form-label">Status</label>
                    <select className="form-select" value={newProjStatus} onChange={(e) => setNewProjStatus(e.target.value)}>
                      <option value="Open">Open</option>
                      <option value="In Progress">In Progress</option>
                      <option value="Resolved">Resolved</option>
                      <option value="Closed">Closed</option>
                    </select>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '12px', marginTop: '20px' }}>
                    <button type="button" className="btn btn-secondary" onClick={() => setShowCreateProjectModal(false)}>Cancel</button>
                    <button type="submit" className="btn btn-primary">Create Project</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* REPORT ISSUE MODAL */}
          {showReportIssueModal && (
            <div className="modal-overlay">
              <div className="modal-box">
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '16px' }}>
                  <h3 style={{ fontSize: '1.2rem', fontWeight: 700 }}>Report Issue</h3>
                  <button className="btn btn-secondary btn-sm" onClick={() => setShowReportIssueModal(false)}><Icons.X /></button>
                </div>
                <form onSubmit={handleReportIssue}>
                  <div className="form-group">
                    <label className="form-label">Project *</label>
                    <select className="form-select" value={newIssueProjId} onChange={(e) => setNewIssueProjId(e.target.value)}>
                      {projects.map(p => <option key={p.projectId} value={p.projectId}>{p.projectName}</option>)}
                    </select>
                  </div>
                  <div className="form-group">
                    <label className="form-label">Title *</label>
                    <input type="text" className="form-input" required value={newIssueTitle} onChange={(e) => setNewIssueTitle(e.target.value)} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Description</label>
                    <textarea className="form-textarea" rows="3" value={newIssueDesc} onChange={(e) => setNewIssueDesc(e.target.value)} />
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                    <div className="form-group">
                      <label className="form-label">Assigned Member</label>
                      <select className="form-select" value={newIssueAssignee} onChange={(e) => setNewIssueAssignee(e.target.value)}>
                        {users.map(u => <option key={u.userId} value={u.userId}>{u.name}</option>)}
                      </select>
                    </div>
                    <div className="form-group">
                      <label className="form-label">Priority</label>
                      <select className="form-select" value={newIssuePriority} onChange={(e) => setNewIssuePriority(e.target.value)}>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                      </select>
                    </div>
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                    <div className="form-group">
                      <label className="form-label">Status</label>
                      <select className="form-select" value={newIssueStatus} onChange={(e) => setNewIssueStatus(e.target.value)}>
                        <option value="Open">Open</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                        <option value="Closed">Closed</option>
                      </select>
                    </div>
                    <div className="form-group">
                      <label className="form-label">Due Date</label>
                      <input type="date" className="form-input" value={newIssueDueDate} onChange={(e) => setNewIssueDueDate(e.target.value)} />
                    </div>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '12px', marginTop: '20px' }}>
                    <button type="button" className="btn btn-secondary" onClick={() => setShowReportIssueModal(false)}>Cancel</button>
                    <button type="submit" className="btn btn-primary">Submit Issue</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADD MEMBER MODAL */}
          {showAddMemberModal && (
            <div className="modal-overlay">
              <div className="modal-box">
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '16px' }}>
                  <h3 style={{ fontSize: '1.2rem', fontWeight: 700 }}>Add Member to Project</h3>
                  <button className="btn btn-secondary btn-sm" onClick={() => setShowAddMemberModal(false)}><Icons.X /></button>
                </div>
                <form onSubmit={handleAddMember}>
                  <div className="form-group">
                    <label className="form-label">Select User</label>
                    <select className="form-select" value={newMemberUserId} onChange={(e) => setNewMemberUserId(e.target.value)}>
                      {users.map(u => <option key={u.userId} value={u.userId}>{u.name} ({u.email})</option>)}
                    </select>
                  </div>
                  <div className="form-group">
                    <label className="form-label">Project Role</label>
                    <input type="text" className="form-input" value={newMemberRole} onChange={(e) => setNewMemberRole(e.target.value)} placeholder="e.g. Developer, Lead, QA" />
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '12px', marginTop: '20px' }}>
                    <button type="button" className="btn btn-secondary" onClick={() => setShowAddMemberModal(false)}>Cancel</button>
                    <button type="submit" className="btn btn-primary">Add Member</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADD USER MODAL */}
          {showAddUserModal && (
            <div className="modal-overlay">
              <div className="modal-box">
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '16px' }}>
                  <h3 style={{ fontSize: '1.2rem', fontWeight: 700 }}>Add New System User</h3>
                  <button className="btn btn-secondary btn-sm" onClick={() => setShowAddUserModal(false)}><Icons.X /></button>
                </div>
                <form onSubmit={handleAddUser}>
                  <div className="form-group">
                    <label className="form-label">Full Name *</label>
                    <input type="text" className="form-input" required value={newUserName} onChange={(e) => setNewUserName(e.target.value)} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Email Address *</label>
                    <input type="email" className="form-input" required value={newUserEmail} onChange={(e) => setNewUserEmail(e.target.value)} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Phone Number</label>
                    <input type="text" className="form-input" value={newUserPhone} onChange={(e) => setNewUserPhone(e.target.value)} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">System Role</label>
                    <select className="form-select" value={newUserRole} onChange={(e) => setNewUserRole(e.target.value)}>
                      <option value="USER">USER</option>
                      <option value="ADMIN">ADMIN</option>
                    </select>
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '12px', marginTop: '20px' }}>
                    <button type="button" className="btn btn-secondary" onClick={() => setShowAddUserModal(false)}>Cancel</button>
                    <button type="submit" className="btn btn-primary">Add User</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
