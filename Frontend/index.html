<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrackFlow — Software Project & Issue Tracking System</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- React 18, Babel & Three.js CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    /* ============================================================
       DESIGN SYSTEM TOKENS
       ============================================================ */
    :root {
      --bg-base: #020817;
      --bg-surface: #0f172a;
      --bg-surface-2: #1e293b;
      --bg-glass: rgba(15, 23, 42, 0.78);
      --bg-glass-light: rgba(30, 41, 59, 0.55);
      --bg-card: rgba(15, 23, 42, 0.85);

      --primary: #38bdf8;
      --primary-dark: #0ea5e9;
      --primary-glow: rgba(56, 189, 248, 0.25);
      --primary-glow-strong: rgba(56, 189, 248, 0.45);

      --secondary: #818cf8;
      --secondary-dark: #6366f1;
      --accent: #a78bfa;

      --success: #34d399;
      --success-bg: rgba(52, 211, 153, 0.12);
      --warning: #fbbf24;
      --warning-bg: rgba(251, 191, 36, 0.12);
      --danger: #f87171;
      --danger-bg: rgba(248, 113, 113, 0.12);

      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --border: rgba(148, 163, 184, 0.12);
      --border-light: rgba(148, 163, 184, 0.08);
      --border-glow: rgba(56, 189, 248, 0.35);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-full: 9999px;

      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-surface); }
    ::-webkit-scrollbar-thumb { background: var(--bg-surface-2); border-radius: var(--radius-full); }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* Utility & Glassmorphism */
    .glass {
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px;
      backdrop-filter: blur(12px);
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
    }
    .card:hover {
      border-color: var(--border-glow);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4), 0 0 15px var(--primary-glow);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-light);
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      font-family: inherit;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary-dark), var(--secondary-dark));
      color: white;
      box-shadow: 0 4px 15px var(--primary-glow);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--primary-glow-strong);
    }
    .btn-secondary {
      background: var(--bg-surface-2);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      border-color: var(--border-glow);
      background: rgba(30, 41, 59, 0.8);
    }
    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
    }
    .btn-ghost:hover {
      background: var(--bg-surface-2);
      color: var(--text-primary);
    }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
    .btn-full { width: 100%; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

    /* Form Inputs */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
    }
    .form-input, .form-select {
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 11px 14px;
      color: var(--text-primary);
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
      width: 100%;
    }
    .form-input:focus, .form-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .form-input.error {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px var(--danger-bg);
    }
    .form-error {
      font-size: 0.78rem;
      color: var(--danger);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper .form-input {
      padding-left: 38px;
    }
    .input-icon-left {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
    }
    .input-icon-right {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      cursor: pointer;
      background: none;
      border: none;
      display: flex;
      padding: 2px;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      font-family: var(--font-mono);
    }
    .badge-open { background: rgba(96, 165, 250, 0.14); color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.3); }
    .badge-in-progress { background: rgba(251, 191, 36, 0.14); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.3); }
    .badge-resolved { background: rgba(52, 211, 153, 0.14); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
    .badge-closed { background: rgba(100, 116, 139, 0.14); color: #94a3b8; border: 1px solid rgba(100, 116, 139, 0.3); }
    
    .badge-low { background: rgba(52, 211, 153, 0.12); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.25); }
    .badge-medium { background: rgba(251, 191, 36, 0.12); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.25); }
    .badge-high { background: rgba(251, 146, 60, 0.12); color: #fb923c; border: 1px solid rgba(251, 146, 60, 0.25); }
    .badge-critical { background: rgba(248, 113, 113, 0.14); color: #f87171; border: 1px solid rgba(248, 113, 113, 0.3); }

    /* Tables */
    .table-wrapper {
      overflow-x: auto;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    thead {
      background: var(--bg-surface-2);
      border-bottom: 1px solid var(--border);
    }
    th {
      padding: 12px 14px;
      text-align: left;
      font-weight: 600;
      font-size: 0.76rem;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-light);
      color: var(--text-primary);
      vertical-align: middle;
    }
    tbody tr:hover { background: rgba(30, 41, 59, 0.4); }
    tbody tr:last-child td { border-bottom: none; }

    /* Progress bar */
    .progress-bar {
      height: 6px;
      background: var(--bg-surface-2);
      border-radius: var(--radius-full);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: var(--radius-full);
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      transition: width 0.8s ease;
    }

    /* Avatars */
    .avatar {
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--primary-dark), var(--secondary-dark));
      color: white;
    }
    .avatar-sm { width: 30px; height: 30px; font-size: 0.75rem; }
    .avatar-md { width: 38px; height: 38px; font-size: 0.9rem; }
    .avatar-lg { width: 64px; height: 64px; font-size: 1.4rem; }

    /* Spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 360px;
    }
    .toast {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 18px;
      border-radius: var(--radius-lg);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .toast-success { border-color: rgba(52, 211, 153, 0.4); }
    .toast-error { border-color: rgba(248, 113, 113, 0.4); }
    .toast-info { border-color: rgba(56, 189, 248, 0.4); }
    .toast-title { font-weight: 700; font-size: 0.88rem; margin-bottom: 2px; }
    .toast-msg { font-size: 0.8rem; color: var(--text-secondary); }

    /* Layout structure */
    .app-layout {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 240px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 20px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary-dark), var(--secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px var(--primary-glow);
    }
    .sidebar-logo-text {
      font-size: 1.15rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sidebar-nav {
      flex: 1;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      transition: all 0.15s;
    }
    .nav-link:hover {
      background: var(--bg-surface-2);
      color: var(--text-primary);
    }
    .nav-link.active {
      background: linear-gradient(135deg, rgba(14,165,233,0.15), rgba(129,140,248,0.15));
      color: var(--primary);
      font-weight: 700;
      border: 1px solid rgba(56,189,248,0.2);
    }
    .sidebar-footer {
      padding: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--bg-surface-2);
      border-radius: var(--radius-md);
    }

    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .top-navbar {
      height: 64px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .page-body {
      flex: 1;
      padding: 26px 28px;
      overflow-y: auto;
    }

    /* Grid utilities */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .grid-bottom {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 20px;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 8, 23, 0.82);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 28px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      animation: modalSlide 0.25s ease;
    }
    @keyframes modalSlide { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* Responsive */
    @media (max-width: 900px) {
      .app-layout { flex-direction: column; }
      .sidebar { width: 100%; height: auto; }
      .grid-2, .grid-bottom { grid-template-columns: 1fr; }
    }
  </style>
</head>

    const ThreeBackground = () => {
      const mountRef = useRef(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 35;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        container.appendChild(renderer.domElement);

        // Nodes
        const NODE_COUNT = 30;
        const nodes = [];
        const geom = new THREE.SphereGeometry(0.3, 16, 16);
        const mat1 = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
        const mat2 = new THREE.MeshBasicMaterial({ color: 0x818cf8 });

        for (let i = 0; i < NODE_COUNT; i++) {
          const mesh = new THREE.Mesh(geom, i % 2 === 0 ? mat1 : mat2);
          mesh.position.set((Math.random() - 0.5) * 45, (Math.random() - 0.5) * 30, (Math.random() - 0.5) * 20);
          mesh.userData = {
            baseY: mesh.position.y,
            speed: 0.5 + Math.random() * 0.8,
            phase: Math.random() * Math.PI * 2
          };
          nodes.push(mesh);
          scene.add(mesh);
        }

        // Connections
        const lineMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.15 });
        const lines = [];
        for (let i = 0; i < NODE_COUNT; i++) {
          for (let j = i + 1; j < NODE_COUNT; j++) {
            if (nodes[i].position.distanceTo(nodes[j].position) < 13) {
              const lineGeo = new THREE.BufferGeometry().setFromPoints([nodes[i].position, nodes[j].position]);
              const line = new THREE.Line(lineGeo, lineMat);
              line.userData = { i, j };
              lines.push(line);
              scene.add(line);
            }
          }
        }

        // Floating wireframe project node
        const wireGeo = new THREE.IcosahedronGeometry(2.5, 0);
        const wireMat = new THREE.MeshBasicMaterial({ color: 0x818cf8, wireframe: true, transparent: true, opacity: 0.25 });
        const wireMesh = new THREE.Mesh(wireGeo, wireMat);
        wireMesh.position.set(-12, 6, -5);
        scene.add(wireMesh);

        let time = 0;
        let animId;
        const animate = () => {
          animId = requestAnimationFrame(animate);
          time += 0.01;
          nodes.forEach((n) => {
            n.position.y = n.userData.baseY + Math.sin(time * n.userData.speed + n.userData.phase) * 1.2;
          });
          lines.forEach((l) => {
            const pos = [nodes[l.userData.i].position, nodes[l.userData.j].position];
            l.geometry.setFromPoints(pos);
          });
          wireMesh.rotation.x += 0.005;
          wireMesh.rotation.y += 0.008;
          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!container) return;
          camera.aspect = container.clientWidth / container.clientHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(container.clientWidth, container.clientHeight);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('resize', handleResize);
          renderer.dispose();
          if (container && renderer.domElement) {
            container.removeChild(renderer.domElement);
          }
        };
      }, []);

      return <div ref={mountRef} style={{ position: 'absolute', inset: 0, pointerEvents: 'none', zIndex: 0 }} />;
    };

                  <div className="grid-2">
                    {/* Project Progress list */}
                    <div className="card glass">
                      <div className="card-header">
                        <h2 className="card-title">Project Milestones</h2>
                        <button className="btn btn-ghost btn-sm" onClick={() => setActiveTab('projects')}>View All</button>
                      </div>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                        {projects.map((p) => (
                          <div key={p.projectId} style={{ padding: 12, background: 'rgba(2,8,23,0.3)', borderRadius: 8 }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
                              <span style={{ fontWeight: 700, fontSize: '0.9rem' }}>{p.projectName}</span>
                              <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.85rem', color: 'var(--primary)', fontWeight: 700 }}>{p.progress}%</span>
                            </div>
                            <div className="progress-bar">
                              <div className="progress-fill" style={{ width: `${p.progress}%` }} />
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Quick Audit / Issues */}
                    <div className="card glass">
                      <div className="card-header">
                        <h2 className="card-title">Priority Severity Spectrum</h2>
                        <span className="badge badge-open">LIVE DB</span>
                      </div>
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                        <div style={{ padding: 14, background: 'rgba(248,113,113,0.1)', border: '1px solid rgba(248,113,113,0.3)', borderRadius: 10, textAlign: 'center' }}>
                          <div style={{ fontSize: '1.5rem', fontWeight: 800, color: 'var(--danger)' }}>3</div>
                          <div style={{ fontSize: '0.75rem', fontWeight: 700, color: 'var(--danger)' }}>Critical Priority</div>
                        </div>
                        <div style={{ padding: 14, background: 'rgba(251,146,60,0.1)', border: '1px solid rgba(251,146,60,0.3)', borderRadius: 10, textAlign: 'center' }}>
                          <div style={{ fontSize: '1.5rem', fontWeight: 800, color: '#fb923c' }}>1</div>
                          <div style={{ fontSize: '0.75rem', fontWeight: 700, color: '#fb923c' }}>High Priority</div>
                        </div>
                        <div style={{ padding: 14, background: 'rgba(251,191,36,0.1)', border: '1px solid rgba(251,191,36,0.3)', borderRadius: 10, textAlign: 'center' }}>
                          <div style={{ fontSize: '1.5rem', fontWeight: 800, color: 'var(--warning)' }}>2</div>
                          <div style={{ fontSize: '0.75rem', fontWeight: 700, color: 'var(--warning)' }}>Medium Priority</div>
                        </div>
                        <div style={{ padding: 14, background: 'rgba(52,211,153,0.1)', border: '1px solid rgba(52,211,153,0.3)', borderRadius: 10, textAlign: 'center' }}>
                          <div style={{ fontSize: '1.5rem', fontWeight: 800, color: 'var(--success)' }}>1</div>
                          <div style={{ fontSize: '0.75rem', fontWeight: 700, color: 'var(--success)' }}>Low Priority</div>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Recent Issues Table */}
                  <div className="card glass">
                    <div className="card-header">
                      <h2 className="card-title">Recent Tickets & Bug Reports</h2>
                      <button className="btn btn-primary btn-sm" onClick={() => setActiveTab('report')}>
                        <Icons.Plus /> <span>Report Issue</span>
                      </button>
                    </div>

                    <div className="table-wrapper">
                      <table>
                        <thead>
                          <tr>
                            <th>ID</th>
                            <th>Issue Title</th>
                            <th>Project</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Assigned To</th>
                            <th>Due Date</th>
                          </tr>
                        </thead>
                        <tbody>
                          {issues.slice(0, 5).map((i) => (
                            <tr key={i.issueId}>
                              <td style={{ fontFamily: 'var(--font-mono)', color: 'var(--primary)', fontWeight: 700 }}>#{i.issueId}</td>
                              <td style={{ fontWeight: 600 }}>{i.title}</td>
                              <td style={{ color: 'var(--text-secondary)' }}>{i.projectName}</td>
                              <td><span className={`badge badge-${i.priorityName.toLowerCase()}`}>{i.priorityName}</span></td>
                              <td><span className={`badge badge-${i.statusName.toLowerCase().replace(' ', '-')}`}>{i.statusName}</span></td>
                              <td>{i.assignedToName}</td>
                              <td style={{ color: 'var(--text-muted)' }}>{i.dueDate}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* VIEW 2: PROJECTS */}
              {activeTab === 'projects' && (
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
                    <div>
                      <h1 style={{ fontSize: '1.8rem', fontWeight: 800 }}>Project Repositories</h1>
                      <p style={{ color: 'var(--text-secondary)', fontSize: '0.9rem' }}>Relational PROJECT table records and team member assignments</p>
                    </div>
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: 20 }}>
                    {projects.map((p) => (
                      <div key={p.projectId} className="card glass">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                          <span className="badge badge-open">Project #{p.projectId}</span>
                          <span className="badge badge-resolved">{p.statusName}</span>
                        </div>
                        <h3 style={{ fontSize: '1.15rem', fontWeight: 700, marginBottom: 8 }}>{p.projectName}</h3>
                        <p style={{ fontSize: '0.85rem', color: 'var(--text-secondary)', marginBottom: 16 }}>{p.description}</p>
                        
                        <div style={{ marginBottom: 14 }}>
                          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.8rem', marginBottom: 4 }}>
                            <span style={{ color: 'var(--text-muted)' }}>Milestone Completion</span>
                            <span style={{ fontWeight: 700, color: 'var(--primary)' }}>{p.progress}%</span>
                          </div>
                          <div className="progress-bar">
                            <div className="progress-fill" style={{ width: `${p.progress}%` }} />
                          </div>
                        </div>

                        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.78rem', color: 'var(--text-muted)', paddingTop: 10, borderTop: '1px solid var(--border)' }}>
                          <span>Deadline: {p.deadline}</span>
                          <span style={{ color: 'var(--danger)' }}>{p.openIssues} Open Issues</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* VIEW 3: ISSUES */}
              {activeTab === 'issues' && (
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
                    <div>
                      <h1 style={{ fontSize: '1.8rem', fontWeight: 800 }}>Issue & Bug Tracker</h1>
                      <p style={{ color: 'var(--text-secondary)', fontSize: '0.9rem' }}>Search and filter issues across the relational DBMS</p>
                    </div>
                    <button className="btn btn-primary" onClick={() => setActiveTab('report')}>
                      <Icons.Plus /> <span>Report New Issue</span>
                    </button>
                  </div>

                  <div className="card glass">
                    <div className="table-wrapper">
                      <table>
                        <thead>
                          <tr>
                            <th>#ID</th>
                            <th>Issue Title</th>
                            <th>Target Project</th>
                            <th>Reported By</th>
                            <th>Assigned To</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Due Date</th>
                          </tr>
                        </thead>
                        <tbody>
                          {issues.map((i) => (
                            <tr key={i.issueId}>
                              <td style={{ fontFamily: 'var(--font-mono)', color: 'var(--primary)', fontWeight: 700 }}>#{i.issueId}</td>
                              <td style={{ fontWeight: 600 }}>{i.title}</td>
                              <td style={{ color: 'var(--text-secondary)' }}>{i.projectName}</td>
                              <td>{i.reportedByName}</td>
                              <td>{i.assignedToName}</td>
                              <td><span className={`badge badge-${i.priorityName.toLowerCase()}`}>{i.priorityName}</span></td>
                              <td><span className={`badge badge-${i.statusName.toLowerCase().replace(' ', '-')}`}>{i.statusName}</span></td>
                              <td style={{ color: 'var(--text-muted)' }}>{i.dueDate}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* VIEW 4: REPORT ISSUE FORM */}
              {activeTab === 'report' && (
                <div style={{ maxWidth: 700, margin: '0 auto' }}>
                  <div className="card glass" style={{ padding: 30 }}>
                    <h2 style={{ fontSize: '1.5rem', fontWeight: 800, marginBottom: 6 }}>Report New Issue / Bug</h2>
                    <p style={{ color: 'var(--text-secondary)', fontSize: '0.88rem', marginBottom: 24 }}>
                      Logs a new record into the <code>ISSUE</code> relation table.
                    </p>

                    <form
                      onSubmit={(e) => {
                        e.preventDefault();
                        const formData = new FormData(e.target);
                        const newId = issues.length + 101;
                        const newObj = {
                          issueId: newId,
                          projectId: Number(formData.get('projectId')),
                          projectName: projects.find(p => p.projectId === Number(formData.get('projectId')))?.projectName || 'Core Project',
                          title: formData.get('title'),
                          description: formData.get('description'),
                          reportedByName: currentUser.name,
                          assignedToName: formData.get('assignedToName'),
                          priorityName: formData.get('priorityName'),
                          statusName: 'Open',
                          createdDate: new Date().toISOString().split('T')[0],
                          dueDate: formData.get('dueDate') || '2024-05-01'
                        };
                        setIssues([newObj, ...issues]);
                        showToast('success', 'Issue Created', `Ticket #${newId} added to database.`);
                        setActiveTab('issues');
                      }}
                      style={{ display: 'flex', flexDirection: 'column', gap: 16 }}
                    >
                      <div className="form-group">
                        <label className="form-label">Issue Title *</label>
                        <input type="text" name="title" className="form-input" placeholder="e.g. Session timeout exception on reload" required />
                      </div>

                      <div className="form-group">
                        <label className="form-label">Description *</label>
                        <textarea name="description" className="form-input" rows="4" placeholder="Detailed reproduction steps and error logs..." required />
                      </div>

                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
                        <div className="form-group">
                          <label className="form-label">Target Project</label>
                          <select name="projectId" className="form-select">
                            {projects.map(p => <option key={p.projectId} value={p.projectId}>{p.projectName}</option>)}
                          </select>
                        </div>

                        <div className="form-group">
                          <label className="form-label">Severity Priority</label>
                          <select name="priorityName" className="form-select">
                            <option value="Critical">Critical</option>
                            <option value="High">High</option>
                            <option value="Medium">Medium</option>
                            <option value="Low">Low</option>
                          </select>
                        </div>
                      </div>

                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
                        <div className="form-group">
                          <label className="form-label">Assign Contributor</label>
                          <select name="assignedToName" className="form-select">
                            <option value="Priya Sharma">Priya Sharma (Frontend)</option>
                            <option value="Ravi Patel">Ravi Patel (Backend)</option>
                            <option value="Sunita Reddy">Sunita Reddy (QA)</option>
                            <option value="Lokesh Kumar">Lokesh Kumar (Admin)</option>
                          </select>
                        </div>

                        <div className="form-group">
                          <label className="form-label">Due Date</label>
                          <input type="date" name="dueDate" className="form-input" />
                        </div>
                      </div>

                      <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 10, marginTop: 10 }}>
                        <button type="button" className="btn btn-secondary" onClick={() => setActiveTab('issues')}>Cancel</button>
                        <button type="submit" className="btn btn-primary">Submit Ticket</button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {/* VIEW 5: USERS MANAGEMENT (ADMIN ONLY) */}
              {activeTab === 'users' && isAdmin && (
                <div>
                  <div style={{ marginBottom: 20 }}>
                    <h1 style={{ fontSize: '1.8rem', fontWeight: 800 }}>USER Entity Database Table</h1>
                    <p style={{ color: 'var(--text-secondary)', fontSize: '0.9rem' }}>Direct representation of the single-table authentication and RBAC structure</p>
                  </div>

                  <div className="card glass">
                    <div className="table-wrapper">
                      <table>
                        <thead>
                          <tr>
                            <th>User ID</th>
                            <th>Name</th>
                            <th>Email Address</th>
                            <th>Phone</th>
                            <th>Role Field</th>
                            <th>Created At</th>
                            <th>Action</th>
                          </tr>
                        </thead>
                        <tbody>
                          {users.map((u) => (
                            <tr key={u.userId}>
                              <td style={{ fontFamily: 'var(--font-mono)', color: 'var(--primary)', fontWeight: 700 }}>#{u.userId}</td>
                              <td style={{ fontWeight: 700 }}>{u.name}</td>
                              <td style={{ color: 'var(--text-secondary)' }}>{u.email}</td>
                              <td style={{ fontFamily: 'var(--font-mono)', fontSize: '0.8rem' }}>{u.phone}</td>
                              <td><span className={`badge ${u.role === 'ADMIN' ? 'badge-high' : 'badge-open'}`}>{u.role}</span></td>
                              <td style={{ color: 'var(--text-muted)' }}>{u.createdAt}</td>
                              <td>
                                <button
                                  className="btn btn-secondary btn-sm"
                                  onClick={() => {
                                    const newRole = u.role === 'ADMIN' ? 'USER' : 'ADMIN';
                                    setUsers(users.map(item => item.userId === u.userId ? { ...item, role: newRole } : item));
                                    showToast('success', 'Role Updated', `${u.name} role changed to ${newRole}`);
                                  }}
                                >
                                  Switch to {u.role === 'ADMIN' ? 'USER' : 'ADMIN'}
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* VIEW 6: REPORTS & AUDIT */}
              {activeTab === 'reports' && isAdmin && (
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }}>
                    <div>
                      <h1 style={{ fontSize: '1.8rem', fontWeight: 800 }}>DBMS Audit Reports & Exports</h1>
                      <p style={{ color: 'var(--text-secondary)', fontSize: '0.9rem' }}>Generate and export relational project summaries (REPORT table)</p>
                    </div>
                    <button
                      className="btn btn-primary"
                      onClick={() => showToast('success', 'Audit Generated', 'PDF summary report generated.')}
                    >
                      <Icons.Download /> <span>Export Full PDF Audit</span>
                    </button>
                  </div>

                  <div className="stats-grid">
                    <div className="card glass">
                      <div style={{ fontSize: '0.75rem', fontWeight: 700, color: 'var(--text-muted)' }}>Mean Time To Resolution</div>
                      <div style={{ fontSize: '1.6rem', fontWeight: 800, color: 'var(--success)' }}>2.4 Days</div>
                    </div>
                    <div className="card glass">
                      <div style={{ fontSize: '0.75rem', fontWeight: 700, color: 'var(--text-muted)' }}>Issue Resolution Index</div>
                      <div style={{ fontSize: '1.6rem', fontWeight: 800, color: 'var(--primary)' }}>57.1%</div>
                    </div>
                    <div className="card glass">
                      <div style={{ fontSize: '0.75rem', fontWeight: 700, color: 'var(--text-muted)' }}>Active Audit Tables</div>
                      <div style={{ fontSize: '1.6rem', fontWeight: 800, color: 'var(--secondary)' }}>8 Entities</div>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
