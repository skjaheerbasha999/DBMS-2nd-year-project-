<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrackFlow — Software Project & Issue Tracking System</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />

  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ============================================================
       DESIGN SYSTEM TOKENS & LIGHT/DARK MODE
       ============================================================ */
    :root, [data-theme="dark"] {
      --bg-base: #0F172A;
      --bg-surface: #1E293B;
      --bg-surface-2: #334155;
      --bg-glass: rgba(15, 23, 42, 0.85);
      --bg-card: #111827;
      --bg-hover: #1F2937;

      --primary: #3B82F6;
      --primary-dark: #2563EB;
      --primary-glow: rgba(59, 130, 246, 0.25);

      --secondary: #818CF8;
      --secondary-dark: #6366F1;

      --success: #10B981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --warning: #F59E0B;
      --warning-bg: rgba(245, 158, 11, 0.12);
      --danger: #EF4444;
      --danger-bg: rgba(239, 68, 68, 0.12);

      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;

      --border: #1E293B;
      --border-light: rgba(148, 163, 184, 0.1);
      --border-glow: rgba(59, 130, 246, 0.35);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 20px;
      --radius-full: 9999px;

      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    [data-theme="light"] {
      --bg-base: #F8FAFC;
      --bg-surface: #FFFFFF;
      --bg-surface-2: #F1F5F9;
      --bg-glass: rgba(255, 255, 255, 0.9);
      --bg-card: #FFFFFF;
      --bg-hover: #F8FAFC;

      --primary: #2563EB;
      --primary-dark: #1D4ED8;
      --primary-glow: rgba(37, 99, 235, 0.15);

      --secondary: #4F46E5;
      --secondary-dark: #4338CA;

      --success: #059669;
      --success-bg: #D1FAE5;
      --warning: #D97706;
      --warning-bg: #FEF3C7;
      --danger: #DC2626;
      --danger-bg: #FEE2E2;

      --text-primary: #0F172A;
      --text-secondary: #64748B;
      --text-muted: #94A3B8;

      --border: #E2E8F0;
      --border-light: #F1F5F9;
      --border-glow: rgba(37, 99, 235, 0.3);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      transition: background-color 0.2s, color 0.2s;
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--radius-full); }

    /* Auth Centered Container */
    .auth-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      background: var(--bg-base);
    }

    .auth-theme-toggle {
      position: absolute;
      top: 24px;
      right: 24px;
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 440px;
      padding: 36px 32px;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .auth-logo {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 900;
      font-size: 1.25rem;
    }

    .auth-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .auth-subtitle {
      font-size: 0.83rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .auth-heading {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-top: 12px;
    }

    .auth-subheading {
      font-size: 0.88rem;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    /* Layout Components */
    .app-header {
      height: 64px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--text-primary);
      text-decoration: none;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 900;
      font-size: 0.95rem;
    }

    .app-body {
      display: flex;
      flex: 1;
    }

    .sidebar {
      width: 240px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }

    .nav-item:hover {
      background: var(--bg-surface-2);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--primary);
      color: #ffffff;
      font-weight: 600;
    }

    .nav-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin: 16px 14px 6px 14px;
    }

    .main-content {
      flex: 1;
      padding: 28px 36px;
      background: var(--bg-base);
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
      transition: border-color 0.2s;
    }

    .card:hover {
      border-color: var(--border-glow);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-light);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-secondary {
      background: var(--bg-surface-2);
      color: var(--text-primary);
      border-color: var(--border);
    }
    .btn-secondary:hover { background: var(--bg-hover); }

    .btn-success { background: var(--success); color: #ffffff; }
    .btn-danger { background: var(--danger); color: #ffffff; }

    .btn-sm { padding: 6px 12px; font-size: 0.8rem; border-radius: var(--radius-sm); }
    .btn-block { width: 100%; }

    /* Tables */
    .table-responsive { overflow-x: auto; }
    .table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    .table th {
      background: var(--bg-surface-2);
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .table td { padding: 14px 16px; border-bottom: 1px solid var(--border-light); color: var(--text-primary); }
    .table tbody tr:hover { background: var(--bg-surface-2); }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 9px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .badge-high, .badge-critical { background: var(--danger-bg); color: var(--danger); }
    .badge-medium { background: var(--warning-bg); color: var(--warning); }
    .badge-low { background: var(--success-bg); color: var(--success); }

    .badge-open { background: rgba(59, 130, 246, 0.15); color: var(--primary); }
    .badge-in-progress { background: var(--warning-bg); color: var(--warning); }
    .badge-resolved, .badge-closed { background: var(--success-bg); color: var(--success); }
    .badge-cat { background: var(--bg-surface-2); color: var(--text-primary); border: 1px solid var(--border); text-transform: none; }

    /* AI Analysis Panel */
    .ai-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-glow);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin: 20px 0;
    }

    .ai-box-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ai-section { margin-bottom: 18px; }
    .ai-section-label {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    .ai-section-content { font-size: 0.93rem; color: var(--text-primary); line-height: 1.6; }

    .code-block {
      background: #020817;
      color: #38bdf8;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      padding: 14px;
      border-radius: var(--radius-md);
      overflow-x: auto;
      margin-top: 8px;
      border: 1px solid var(--border);
    }

    /* Timeline */
    .timeline { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; position: relative; padding-left: 20px; }
    .timeline::before { content: ''; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
    .timeline-item { position: relative; display: flex; flex-direction: column; gap: 2px; }
    .timeline-dot { position: absolute; left: -20px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); border: 2px solid var(--bg-card); }
    .timeline-event { font-size: 0.88rem; font-weight: 700; color: var(--text-primary); }
    .timeline-desc { font-size: 0.82rem; color: var(--text-secondary); }
    .timeline-date { font-size: 0.75rem; color: var(--text-muted); }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 580px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .form-group { margin-bottom: 18px; text-align: left; }
    .form-label { display: block; font-size: 0.83rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    .input-password-wrapper { position: relative; display: flex; align-items: center; }
    .input-eye-btn {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
    }

    .error-box {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      margin-bottom: 18px;
      text-align: left;
    }

    .role-badge { padding: 4px 10px; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; }
    .role-user { background: var(--bg-surface-2); color: var(--primary); border: 1px solid var(--border); }
    .role-admin { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning); }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // SVG Icons
    const Icons = {
      LayoutDashboard: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>,
      AlertCircle: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
      PlusCircle: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>,
      Users: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
      Bot: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8.01" y2="16"/><line x1="16" y1="16" x2="16.01" y2="16"/></svg>,
      FileText: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>,
      User: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
      LogOut: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
      Sun: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>,
      Moon: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>,
      Check: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12"/></svg>,
      X: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
      Eye: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>,
      EyeOff: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>,
      RefreshCw: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    };

    const API_BASE = '/api';

    function App() {
      // Theme State (Persisted)
      const [theme, setTheme] = useState(localStorage.getItem('trackflow_theme') || 'dark');
      
      // Authentication Session State
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('trackflow_user');
        return saved ? JSON.parse(saved) : null;
      });

      const [authView, setAuthView] = useState('login'); // 'login' or 'register'
      const [showPassword, setShowPassword] = useState(false);
      const [showConfirmPassword, setShowConfirmPassword] = useState(false);
      const [authLoading, setAuthLoading] = useState(false);
      const [authError, setAuthError] = useState('');

      // Form States
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');

      const [regName, setRegName] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regPassword, setRegPassword] = useState('');
      const [regConfirmPassword, setRegConfirmPassword] = useState('');

      const [activeTab, setActiveTab] = useState('dashboard');

      // Data States
      const [issues, setIssues] = useState([]);
      const [usersList, setUsersList] = useState([]);
      const [stats, setStats] = useState(null);

      // Selected Issue Detail & AI Solver State
      const [selectedIssue, setSelectedIssue] = useState(null);
      const [aiLoading, setAiLoading] = useState(false);
      const [aiSolution, setAiSolution] = useState(null);
      const [additionalNote, setAdditionalNote] = useState('');
      const [showStillNotSolvedInput, setShowStillNotSolvedInput] = useState(false);

      // Modals
      const [showReportModal, setShowReportModal] = useState(false);
      const [newTitle, setNewTitle] = useState('');
      const [newDesc, setNewDesc] = useState('');
      const [newCategory, setNewCategory] = useState('Backend');
      const [newPriority, setNewPriority] = useState('Medium');

      // Theme toggle handler
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('trackflow_theme', theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));
      };

      // Handle Login Submit
      const handleLoginSubmit = async (e) => {
        e.preventDefault();
        setAuthError('');

        if (!loginEmail.trim() || !loginPassword.trim()) {
          setAuthError('Please enter both email and password.');
          return;
        }

        setAuthLoading(true);
        try {
          const res = await fetch(`${API_BASE}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: loginEmail, password: loginPassword })
          });
          const data = await res.json();

          if (data.success && data.user) {
            const userObj = {
              ...data.user,
              userId: data.user.user_id || data.user.userId
            };
            localStorage.setItem('trackflow_user', JSON.stringify(userObj));
            localStorage.setItem('trackflow_token', data.token);
            setCurrentUser(userObj);
            setActiveTab('dashboard');
          } else {
            setAuthError(data.message || 'Invalid email or password.');
          }
        } catch (err) {
          setAuthError('Invalid email or password.');
        } finally {
          setAuthLoading(false);
        }
      };

      // Handle Register Submit
      const handleRegisterSubmit = async (e) => {
        e.preventDefault();
        setAuthError('');

        if (!regName.trim() || !regEmail.trim() || !regPassword.trim() || !regConfirmPassword.trim()) {
          setAuthError('All fields marked with * are required.');
          return;
        }

        if (regPassword !== regConfirmPassword) {
          setAuthError('Passwords do not match.');
          return;
        }

        if (regPassword.length < 6) {
          setAuthError('Password must be at least 6 characters long.');
          return;
        }

        setAuthLoading(true);
        try {
          const res = await fetch(`${API_BASE}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: regName,
              email: regEmail,
              password: regPassword
            })
          });
          const data = await res.json();

          if (data.success && data.user) {
            const userObj = {
              ...data.user,
              userId: data.user.user_id || data.user.userId
            };
            localStorage.setItem('trackflow_user', JSON.stringify(userObj));
            localStorage.setItem('trackflow_token', data.token);
            setCurrentUser(userObj);
            setActiveTab('dashboard');
          } else {
            setAuthError(data.message || 'Registration failed. Please check your inputs.');
          }
        } catch (err) {
          setAuthError('Registration failed. Please try again.');
        } finally {
          setAuthLoading(false);
        }
      };

      // Quick Demo Preset Filler
      const handlePresetLogin = (email, password) => {
        setLoginEmail(email);
        setLoginPassword(password);
        setAuthError('');
      };

      // Logout Handler
      const handleLogout = () => {
        localStorage.removeItem('trackflow_user');
        localStorage.removeItem('trackflow_token');
        setCurrentUser(null);
        setAuthView('login');
        setLoginEmail('');
        setLoginPassword('');
        setAuthError('');
      };

      // Fetch Issues & Stats
      const fetchData = async () => {
        if (!currentUser) return;
        try {
          const uId = currentUser.user_id || currentUser.userId;
          const isUser = currentUser.role === 'USER';
          const issuesUrl = isUser ? `${API_BASE}/issues?reported_by=${uId}` : `${API_BASE}/issues`;
          const resIssues = await fetch(issuesUrl);
          const dataIssues = await resIssues.json();
          if (dataIssues.success) setIssues(dataIssues.data);

          const statsUrl = isUser ? `${API_BASE}/stats/summary?user_id=${uId}` : `${API_BASE}/stats/summary`;
          const resStats = await fetch(statsUrl);
          const dataStats = await resStats.json();
          if (dataStats.success) setStats(dataStats.data);

          if (currentUser.role === 'ADMIN') {
            const resUsers = await fetch(`${API_BASE}/users`);
            const dataUsers = await resUsers.json();
            if (dataUsers.success) setUsersList(dataUsers.data);
          }
        } catch (err) {
          console.error('Error loading data:', err);
        }
      };

      useEffect(() => {
        if (currentUser) fetchData();
      }, [currentUser, activeTab]);

      // Report Issue Submit
      const handleReportSubmit = async (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;

        try {
          const res = await fetch(`${API_BASE}/issues`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              title: newTitle,
              description: newDesc,
              category: newCategory,
              priority: newPriority,
              reported_by: currentUser.user_id || currentUser.userId
            })
          });
          const data = await res.json();
          if (data.success) {
            setShowReportModal(false);
            setNewTitle('');
            setNewDesc('');
            fetchData();
          }
        } catch (err) {
          alert('Failed to report issue.');
        }
      };

      // Load Single Issue Detail
      const handleOpenIssueDetail = async (issueId) => {
        try {
          const res = await fetch(`${API_BASE}/issues/${issueId}`);
          const data = await res.json();
          if (data.success) {
            setSelectedIssue(data.data);
            if (data.data.ai_solution_json) {
              try {
                setAiSolution(JSON.parse(data.data.ai_solution_json));
              } catch (e) {
                setAiSolution(null);
              }
            } else {
              setAiSolution(null);
            }
            setShowStillNotSolvedInput(false);
            setAdditionalNote('');
          }
        } catch (err) {
          console.error('Error fetching issue detail:', err);
        }
      };

      // AI Solve Problem Trigger
      const handleAISolve = async () => {
        if (!selectedIssue) return;
        setAiLoading(true);
        try {
          const res = await fetch(`${API_BASE}/ai/solve-issue`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              issue_id: selectedIssue.issue_id,
              title: selectedIssue.title,
              description: selectedIssue.description,
              category: selectedIssue.category,
              priority: selectedIssue.priority_name,
              comments: selectedIssue.comments
            })
          });
          const data = await res.json();
          if (data.success && data.aiSolution) {
            setAiSolution(data.aiSolution);
            handleOpenIssueDetail(selectedIssue.issue_id);
            fetchData();
          }
        } catch (err) {
          alert('Could not trigger AI problem solver.');
        } finally {
          setAiLoading(false);
        }
      };

      // Confirm Solution
      const handleConfirmSolution = async (solved) => {
        if (!selectedIssue) return;
        try {
          const res = await fetch(`${API_BASE}/issues/${selectedIssue.issue_id}/confirm-solution`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              solved,
              additional_info: additionalNote,
              user_id: currentUser.user_id || currentUser.userId
            })
          });
          const data = await res.json();
          if (data.success) {
            setAdditionalNote('');
            setShowStillNotSolvedInput(false);
            handleOpenIssueDetail(selectedIssue.issue_id);
            fetchData();
          }
        } catch (err) {
          alert('Could not update solution status.');
        }
      };

      if (!currentUser) {
        return (

            {/* Top Right Theme Toggle */}
            <div className="auth-theme-toggle">
              <button className="btn btn-secondary btn-sm" onClick={toggleTheme} title="Toggle Light/Dark Mode">
                {theme === 'dark' ? <Icons.Sun /> : <Icons.Moon />}
              </button>
            </div>

            {/* LOGIN PAGE VIEW */}
            {authView === 'login' && (
              <div className="auth-card">
                <div className="auth-brand">
                  <div className="auth-logo">TF</div>
                  <div className="auth-title">TrackFlow</div>
                  <div className="auth-subtitle">Software Issue Resolution System</div>
                </div>

                <div className="auth-heading">Welcome back</div>
                <div className="auth-subheading">Sign in to report and resolve your software issues.</div>

                {authError && <div className="error-box">{authError}</div>}

                <form onSubmit={handleLoginSubmit}>
                  <div className="form-group">
                    <label className="form-label">Email</label>
                    <input
                      type="email"
                      className="form-input"
                      required
                      placeholder="Enter your email"
                      value={loginEmail}
                      onChange={(e) => setLoginEmail(e.target.value)}
                    />
                  </div>

                  <div className="form-group">
                    <label className="form-label">Password</label>
                    <div className="input-password-wrapper">
                      <input
                        type={showPassword ? 'text' : 'password'}
                        className="form-input"
                        required
                        placeholder="Enter your password"
                        value={loginPassword}
                        onChange={(e) => setLoginPassword(e.target.value)}
                      />
                      <button
                        type="button"
                        className="input-eye-btn"
                        onClick={() => setShowPassword(!showPassword)}
                        title={showPassword ? 'Hide password' : 'Show password'}
                      >
                        {showPassword ? <Icons.EyeOff /> : <Icons.Eye />}
                      </button>
                    </div>
                  </div>

                  <button type="submit" className="btn btn-primary btn-block" disabled={authLoading}>
                    {authLoading ? 'Signing in...' : 'Login'}
                  </button>
                </form>

                <div style={{ marginTop: '20px', fontSize: '0.88rem', color: 'var(--text-secondary)' }}>
                  Don't have an account?{' '}
                  <button
                    type="button"
                    style={{ background: 'none', border: 'none', color: 'var(--primary)', fontWeight: 600, cursor: 'pointer' }}
                    onClick={() => { setAuthView('register'); setAuthError(''); }}
                  >
                    Create Account
                  </button>
                </div>

                {/* Discreet Admin Login & Quick Demo Credentials */}
                <div style={{ marginTop: '24px', paddingTop: '16px', borderTop: '1px solid var(--border-light)', fontSize: '0.8rem', color: 'var(--text-muted)' }}>
                  <button
                    type="button"
                    style={{ background: 'none', border: 'none', color: 'var(--text-secondary)', cursor: 'pointer', fontSize: '0.8rem', textDecoration: 'underline' }}
                    onClick={() => handlePresetLogin('admin@trackflow.com', 'admin123')}
                  >
                    Admin Login
                  </button>
                  <div style={{ marginTop: '10px', fontSize: '0.75rem' }}>
                    Quick Demo: <a href="#" style={{ color: 'var(--primary)' }} onClick={(e) => { e.preventDefault(); handlePresetLogin('rahul@trackflow.com', 'user123'); }}>User (Rahul)</a> | <a href="#" style={{ color: 'var(--primary)' }} onClick={(e) => { e.preventDefault(); handlePresetLogin('admin@trackflow.com', 'admin123'); }}>Admin</a>
                  </div>
                </div>
              </div>
            )}

            {/* REGISTRATION PAGE VIEW */}
            {authView === 'register' && (
              <div className="auth-card">
                <div className="auth-brand">
                  <div className="auth-logo">TF</div>
                  <div className="auth-title">TrackFlow</div>
                  <div className="auth-subtitle">Software Issue Resolution System</div>
                </div>

                <div className="auth-heading">Create Account</div>
                <div className="auth-subheading">Sign up to start reporting and resolving software issues.</div>

                {authError && <div className="error-box">{authError}</div>}

                <form onSubmit={handleRegisterSubmit}>
                  <div className="form-group">
                    <label className="form-label">Full Name *</label>
                    <input
                      type="text"
                      className="form-input"
                      required
                      placeholder="Enter your full name"
                      value={regName}
                      onChange={(e) => setRegName(e.target.value)}
                    />
                  </div>

                  <div className="form-group">
                    <label className="form-label">Email *</label>
                    <input
                      type="email"
                      className="form-input"
                      required
                      placeholder="Enter your email"
                      value={regEmail}
                      onChange={(e) => setRegEmail(e.target.value)}
                    />
                  </div>

                  <div className="form-group">
                    <label className="form-label">Password *</label>
                    <div className="input-password-wrapper">
                      <input
                        type={showPassword ? 'text' : 'password'}
                        className="form-input"
                        required
                        placeholder="Enter your password"
                        value={regPassword}
                        onChange={(e) => setRegPassword(e.target.value)}
                      />
                      <button
                        type="button"
                        className="input-eye-btn"
                        onClick={() => setShowPassword(!showPassword)}
                      >
                        {showPassword ? <Icons.EyeOff /> : <Icons.Eye />}
                      </button>
                    </div>
                  </div>

                  <div className="form-group">
                    <label className="form-label">Confirm Password *</label>
                    <div className="input-password-wrapper">
                      <input
                        type={showConfirmPassword ? 'text' : 'password'}
                        className="form-input"
                        required
                        placeholder="Re-enter your password"
                        value={regConfirmPassword}
                        onChange={(e) => setRegConfirmPassword(e.target.value)}
                      />
                      <button
                        type="button"
                        className="input-eye-btn"
                        onClick={() => setShowConfirmPassword(!showConfirmPassword)}
                      >
                        {showConfirmPassword ? <Icons.EyeOff /> : <Icons.Eye />}
                      </button>
                    </div>
                  </div>

                  <button type="submit" className="btn btn-primary btn-block" disabled={authLoading}>
                    {authLoading ? 'Creating Account...' : 'Create Account'}
                  </button>
                </form>

                <div style={{ marginTop: '20px', fontSize: '0.88rem', color: 'var(--text-secondary)' }}>
                  Already have an account?{' '}
                  <button
                    type="button"
                    style={{ background: 'none', border: 'none', color: 'var(--primary)', fontWeight: 600, cursor: 'pointer' }}
                    onClick={() => { setAuthView('login'); setAuthError(''); }}
                  >
                    Sign In
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      }

      // AUTHENTICATED: DASHBOARD APPLICATION VIEW
      return (
        <div>
          {/* HEADER */}
          <header className="app-header">
            <div className="brand">
              <div className="brand-logo">TF</div>
              <span>TrackFlow</span>
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
              {/* Theme Toggle Button */}
              <button className="btn btn-secondary btn-sm" onClick={toggleTheme} title="Toggle Light/Dark Mode">
                {theme === 'dark' ? <Icons.Sun /> : <Icons.Moon />}
              </button>

              {/* + Report Issue Header Button */}
              <button className="btn btn-primary btn-sm" onClick={() => setShowReportModal(true)}>
                <Icons.PlusCircle /> + Report Issue
              </button>

              {/* User Avatar Info & Logout */}
              <div style={{ display: 'flex', alignItems: 'center', gap: '12px', borderLeft: '1px solid var(--border)', paddingLeft: '16px' }}>
                <div style={{ textAlign: 'right' }}>
                  <div style={{ fontSize: '0.88rem', fontWeight: 600 }}>{currentUser.name}</div>
                  <span className={`role-badge ${currentUser.role === 'ADMIN' ? 'role-admin' : 'role-user'}`}>
                    {currentUser.role}
                  </span>
                </div>
                <button className="btn btn-secondary btn-sm" onClick={handleLogout} title="Sign Out">
                  <Icons.LogOut />
                </button>
              </div>
            </div>
          </header>

          <div className="app-body">
            {/* SIDEBAR NAVIGATION */}
            <aside className="sidebar">
              <div className="nav-section-title">Navigation</div>
              
              <button className={`nav-item ${activeTab === 'dashboard' ? 'active' : ''}`} onClick={() => setActiveTab('dashboard')}>
                <Icons.LayoutDashboard /> Dashboard
              </button>

              {currentUser.role === 'USER' ? (
                <>
                  <button className={`nav-item ${activeTab === 'issues' ? 'active' : ''}`} onClick={() => setActiveTab('issues')}>
                    <Icons.AlertCircle /> My Issues
                  </button>
                  <button className="nav-item" onClick={() => setShowReportModal(true)}>
                    <Icons.PlusCircle /> Report Issue
                  </button>
                </>
              ) : (
                <>
                  <button className={`nav-item ${activeTab === 'users' ? 'active' : ''}`} onClick={() => setActiveTab('users')}>
                    <Icons.Users /> Users
                  </button>
                  <button className={`nav-item ${activeTab === 'issues' ? 'active' : ''}`} onClick={() => setActiveTab('issues')}>
                    <Icons.AlertCircle /> Issues
                  </button>
                  <button className={`nav-item ${activeTab === 'ai-solutions' ? 'active' : ''}`} onClick={() => setActiveTab('ai-solutions')}>
                    <Icons.Bot /> AI Solutions
                  </button>
                  <button className={`nav-item ${activeTab === 'reports' ? 'active' : ''}`} onClick={() => setActiveTab('reports')}>
                    <Icons.FileText /> Reports
                  </button>
                </>
              )}

              <button className={`nav-item ${activeTab === 'profile' ? 'active' : ''}`} onClick={() => setActiveTab('profile')}>
                <Icons.User /> Profile
              </button>
              
              <button className="nav-item" style={{ marginTop: 'auto', color: 'var(--danger)' }} onClick={handleLogout}>
                <Icons.LogOut /> Logout
              </button>
            </aside>

            {/* MAIN CONTENT AREA */}
            <main className="main-content">
              
              {/* USER DASHBOARD VIEW */}
              {activeTab === 'dashboard' && currentUser.role === 'USER' && (
                <div>
                  <h2 style={{ fontSize: '1.4rem', fontWeight: 800, marginBottom: '20px' }}>User Dashboard</h2>
                  
                  {/* User Stat Cards */}
                  <div className="grid-4">
                    <div className="stat-card">
                      <div className="stat-label">My Issues</div>
                      <div className="stat-value">{stats ? stats.my_issues : 0}</div>
                    </div>
                    <div className="stat-card">
                      <div className="stat-label">Open Issues</div>
                      <div className="stat-value" style={{ color: 'var(--primary)' }}>{stats ? stats.open_issues : 0}</div>
                    </div>
                    <div className="stat-card">
                      <div className="stat-label">In Progress</div>
                      <div className="stat-value" style={{ color: 'var(--warning)' }}>{stats ? stats.in_progress : 0}</div>
                    </div>
                    <div className="stat-card">
                      <div className="stat-label">Resolved</div>
                      <div className="stat-value" style={{ color: 'var(--success)' }}>{stats ? stats.resolved : 0}</div>
                    </div>
                  </div>

                  {/* My Recent Issues Table */}
                  <div className="card">
                    <div className="card-header">
                      <div className="card-title">My Recent Issues</div>
                    </div>
                    <div className="table-responsive">
                      <table className="table">
                        <thead>
                          <tr>
                            <th>Issue</th>
                            <th>Category</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>AI Solution</th>
                            <th>Action</th>
                          </tr>
                        </thead>
                        <tbody>
                          {issues.length === 0 ? (
                            <tr><td colSpan="6" style={{ textAlign: 'center', color: 'var(--text-muted)' }}>No reported issues found.</td></tr>
                          ) : (
                            issues.map(iss => (
                              <tr key={iss.issue_id}>
                                <td style={{ fontWeight: 600 }}>{iss.title}</td>
                                <td><span className="badge badge-cat">{iss.category || 'Backend'}</span></td>
                                <td>
                                  <span className={`badge badge-${(iss.priority_name || 'medium').toLowerCase()}`}>
                                    {iss.priority_name || 'Medium'}
                                  </span>
                                </td>
                                <td>
                                  <span className={`badge badge-${(iss.status_name || 'open').toLowerCase().replace(' ', '-')}`}>
                                    {iss.status_name || 'Open'}
                                  </span>
                                </td>
                                <td>
                                  <span style={{ fontSize: '0.85rem', color: iss.ai_status === 'Solved' ? 'var(--success)' : iss.ai_status === 'Generated' ? 'var(--primary)' : 'var(--text-secondary)' }}>
                                    {iss.ai_status || 'Available'}
                                  </span>
                                </td>
                                <td>
                                  <button className="btn btn-secondary btn-sm" onClick={() => handleOpenIssueDetail(iss.issue_id)}>
                                    View
                                  </button>
                                </td>
                              </tr>
                            ))
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* ADMIN DASHBOARD VIEW */}
              {activeTab === 'dashboard' && currentUser.role === 'ADMIN' && (
                <div>
                  <h2 style={{ fontSize: '1.4rem', fontWeight: 800, marginBottom: '20px' }}>System Admin Dashboard</h2>

                  {/* Admin Row 1 Cards */}
                  <div className="grid-4">
                    <div className="stat-card">
                      <div className="stat-label">Total Users</div>
                      <div className="stat-value">{stats ? stats.users_total : 0}</div>
                    </div>
                    <div className="stat-card">
                      <div className="stat-label">Active Users</div>
                      <div className="stat-value">{stats ? stats.users_active : 0}</div>
                    </div>
                    <div className="stat-card">
                      <div className="stat-label">Total Issues</div>
                      <div className="stat-value">{stats ? stats.issues_total : 0}</div>
                    </div>
                    <div className="stat-card">
                      <div className="stat-label">Resolved Issues</div>
                      <div className="stat-value" style={{ color: 'var(--success)' }}>{stats ? stats.issues_resolved : 0}</div>
                    </div>
                  </div>

                  {/* Admin Row 2 Cards */}
                  <div className="grid-4">
                    <div className="stat-card">
                      <div className="stat-label">Open Issues</div>
                      <div className="stat-value" style={{ color: 'var(--primary)' }}>{stats ? stats.issues_open : 0}</div>
                    </div>
                    <div className="stat-card">
                      <div className="stat-label">In Progress</div>
                      <div className="stat-value" style={{ color: 'var(--warning)' }}>{stats ? stats.issues_in_progress : 0}</div>
                    </div>
                    <div className="stat-card">
                      <div className="stat-label">High Priority</div>
                      <div className="stat-value" style={{ color: 'var(--danger)' }}>{stats ? stats.issues_high_priority : 0}</div>
                    </div>
                    <div className="stat-card">
                      <div className="stat-label">AI Assisted</div>
                      <div className="stat-value" style={{ color: 'var(--secondary)' }}>{stats ? stats.issues_ai_assisted : 0}</div>
                    </div>
                  </div>

                  {/* Admin Recent Issues Table */}
                  <div className="card">
                    <div className="card-header">
                      <div className="card-title">All System Recent Issues</div>
                    </div>
                    <div className="table-responsive">
                      <table className="table">
                        <thead>
                          <tr>
                            <th>Issue ID</th>
                            <th>Issue</th>
                            <th>User</th>
                            <th>Category</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>AI Solution</th>
                            <th>Action</th>
                          </tr>
                        </thead>
                        <tbody>
                          {issues.map(iss => (
                            <tr key={iss.issue_id}>
                              <td style={{ fontFamily: 'var(--font-mono)', fontWeight: 600 }}>#{iss.issue_id}</td>
                              <td style={{ fontWeight: 600 }}>{iss.title}</td>
                              <td>{iss.reporter_name || 'User'}</td>
                              <td><span className="badge badge-cat">{iss.category || 'Backend'}</span></td>
                              <td>
                                <span className={`badge badge-${(iss.priority_name || 'medium').toLowerCase()}`}>
                                  {iss.priority_name || 'Medium'}
                                </span>
                              </td>
                              <td>
                                <span className={`badge badge-${(iss.status_name || 'open').toLowerCase().replace(' ', '-')}`}>
                                  {iss.status_name || 'Open'}
                                </span>
                              </td>
                              <td>{iss.ai_status || 'Generated'}</td>
                              <td>
                                <button className="btn btn-secondary btn-sm" onClick={() => handleOpenIssueDetail(iss.issue_id)}>
                                  View
                                </button>
                              </td>
                            </tr>

                        </tbody>
                      </table>
                    </div>
                  </div>

              {/* ISSUES TAB */}
              {activeTab === 'issues' && (
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
                    <h2 style={{ fontSize: '1.4rem', fontWeight: 800 }}>
                      {currentUser.role === 'USER' ? 'My Reported Issues' : 'All System Issues'}
                    </h2>
                    <button className="btn btn-primary" onClick={() => setShowReportModal(true)}>
                      <Icons.PlusCircle /> + Report Issue
                    </button>
                  </div>

                  <div className="card">
                    <div className="table-responsive">
                      <table className="table">
                        <thead>
                          <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Reported Date</th>
                            <th>Action</th>
                          </tr>
                        </thead>
                        <tbody>
                          {issues.map(iss => (
                            <tr key={iss.issue_id}>
                              <td style={{ fontFamily: 'var(--font-mono)' }}>#{iss.issue_id}</td>
                              <td style={{ fontWeight: 600 }}>{iss.title}</td>
                              <td><span className="badge badge-cat">{iss.category || 'Backend'}</span></td>
                              <td>
                                <span className={`badge badge-${(iss.priority_name || 'medium').toLowerCase()}`}>
                                  {iss.priority_name || 'Medium'}
                                </span>
                              </td>
                              <td>
                                <span className={`badge badge-${(iss.status_name || 'open').toLowerCase().replace(' ', '-')}`}>
                                  {iss.status_name || 'Open'}
                                </span>
                              </td>
                              <td>{iss.created_date ? iss.created_date.slice(0, 10) : 'Recent'}</td>
                              <td>
                                <button className="btn btn-secondary btn-sm" onClick={() => handleOpenIssueDetail(iss.issue_id)}>
                                  Inspect & Solve
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* ADMIN USERS PAGE */}
              {activeTab === 'users' && currentUser.role === 'ADMIN' && (
                <div>
                  <h2 style={{ fontSize: '1.4rem', fontWeight: 800, marginBottom: '20px' }}>Registered System Users</h2>
                  <div className="card">
                    <div className="table-responsive">
                      <table className="table">
                        <thead>
                          <tr>
                            <th>User ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Registration Date</th>
                            <th>Number of Issues</th>
                            <th>Open Issues</th>
                            <th>Resolved Issues</th>
                          </tr>
                        </thead>
                        <tbody>
                          {usersList.map(u => (
                            <tr key={u.user_id}>
                              <td style={{ fontFamily: 'var(--font-mono)' }}>#{u.user_id}</td>
                              <td style={{ fontWeight: 600 }}>{u.name}</td>
                              <td>{u.email}</td>
                              <td>{u.created_at ? u.created_at.slice(0, 10) : '2026-09-01'}</td>
                              <td>{u.total_issues || 0}</td>
                              <td style={{ color: 'var(--primary)' }}>{u.open_issues || 0}</td>
                              <td style={{ color: 'var(--success)' }}>{u.resolved_issues || 0}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* ADMIN AI SOLUTIONS PAGE */}
              {activeTab === 'ai-solutions' && currentUser.role === 'ADMIN' && (
                <div>
                  <h2 style={{ fontSize: '1.4rem', fontWeight: 800, marginBottom: '20px' }}>AI Solutions & Diagnostic Hub</h2>

                  <div className="grid-4" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))' }}>
                    <div className="stat-card">
                      <div className="stat-label">Total AI Analyses</div>
                      <div className="stat-value">{stats ? stats.ai_total_analyses : 0}</div>
                    </div>
                    <div className="stat-card">
                      <div className="stat-label">AI Assisted Issues</div>
                      <div className="stat-value" style={{ color: 'var(--secondary)' }}>{stats ? stats.ai_assisted_issues : 0}</div>
                    </div>
                    <div className="stat-card">
                      <div className="stat-label">Successfully Resolved</div>
                      <div className="stat-value" style={{ color: 'var(--success)' }}>{stats ? stats.ai_successfully_resolved : 0}</div>
                    </div>
                    <div className="stat-card">
                      <div className="stat-label">Multiple Attempts</div>
                      <div className="stat-value" style={{ color: 'var(--warning)' }}>{stats ? stats.ai_multiple_attempts : 0}</div>
                    </div>
                  </div>

                  <div className="card">
                    <div className="card-header">
                      <div className="card-title">AI Resolution Activity Log</div>
                    </div>
                    <div className="table-responsive">
                      <table className="table">
                        <thead>
                          <tr>
                            <th>Issue</th>
                            <th>User</th>
                            <th>Category</th>
                            <th>Attempts</th>
                            <th>Final Status</th>
                            <th>Action</th>
                          </tr>
                        </thead>
                        <tbody>
                          {issues.filter(i => (i.ai_attempts || 0) > 0 || i.ai_status !== 'Not Requested').map(i => (
                            <tr key={i.issue_id}>
                              <td style={{ fontWeight: 600 }}>{i.title}</td>
                              <td>{i.reporter_name || 'User'}</td>
                              <td><span className="badge badge-cat">{i.category || 'Backend'}</span></td>
                              <td>{i.ai_attempts || 1}</td>
                              <td>
                                <span className={`badge badge-${(i.status_name || 'open').toLowerCase().replace(' ', '-')}`}>
                                  {i.status_name || 'Open'}
                                </span>
                              </td>
                              <td>
                                <button className="btn btn-secondary btn-sm" onClick={() => handleOpenIssueDetail(i.issue_id)}>
                                  View Analysis
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* ADMIN REPORTS PAGE */}
              {activeTab === 'reports' && currentUser.role === 'ADMIN' && (
                <div>
                  <h2 style={{ fontSize: '1.4rem', fontWeight: 800, marginBottom: '20px' }}>System Reports & Analytics</h2>

                  <div className="card">
                    <div className="card-header">
                      <div className="card-title">Category Breakdown</div>
                    </div>
                    <div className="table-responsive">
                      <table className="table">
                        <thead>
                          <tr>
                            <th>Category</th>
                            <th>Total Issues Logged</th>
                            <th>Distribution</th>
                          </tr>
                        </thead>
                        <tbody>
                          {stats && stats.category_breakdown ? (
                            stats.category_breakdown.map((c, idx) => (
                              <tr key={idx}>
                                <td style={{ fontWeight: 600 }}>{c.category}</td>
                                <td>{c.count}</td>
                                <td>
                                  <div style={{ background: 'var(--bg-surface-2)', height: '8px', borderRadius: '4px', width: '100%', maxWidth: '200px' }}>
                                    <div style={{ background: 'var(--primary)', height: '100%', borderRadius: '4px', width: `${Math.min(100, (c.count / (stats.issues_total || 1)) * 100)}%` }}></div>
                                  </div>
                                </td>
                              </tr>
                            ))
                          ) : (
                            <tr><td colSpan="3">Loading report metrics...</td></tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* PROFILE TAB */}
              {activeTab === 'profile' && (
                <div>
                  <h2 style={{ fontSize: '1.4rem', fontWeight: 800, marginBottom: '20px' }}>User Profile</h2>
                  <div className="card" style={{ maxWidth: '600px' }}>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                      <div>
                        <div style={{ fontSize: '0.8rem', color: 'var(--text-secondary)' }}>Full Name</div>
                        <div style={{ fontSize: '1.1rem', fontWeight: 700 }}>{currentUser.name}</div>
                      </div>
                      <div>
                        <div style={{ fontSize: '0.8rem', color: 'var(--text-secondary)' }}>Email Address</div>
                        <div style={{ fontSize: '1rem' }}>{currentUser.email}</div>
                      </div>
                      <div>
                        <div style={{ fontSize: '0.8rem', color: 'var(--text-secondary)' }}>Account Role</div>
                        <span className={`role-badge ${currentUser.role === 'ADMIN' ? 'role-admin' : 'role-user'}`}>
                          {currentUser.role}
                        </span>
                      </div>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* REPORT ISSUE MODAL */}
          {showReportModal && (
            <div className="modal-overlay">
              <div className="modal-box">
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '16px' }}>
                  <h3 style={{ fontSize: '1.1rem', fontWeight: 700 }}>+ Report New Software Issue</h3>
                  <button className="btn btn-secondary btn-sm" onClick={() => setShowReportModal(false)}><Icons.X /></button>
                </div>
                <form onSubmit={handleReportSubmit}>
                  <div className="form-group">
                    <label className="form-label">Issue Title *</label>
                    <input type="text" className="form-input" required placeholder="e.g. Login API returns HTTP 500 error" value={newTitle} onChange={(e) => setNewTitle(e.target.value)} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Category *</label>
                    <select className="form-select" value={newCategory} onChange={(e) => setNewCategory(e.target.value)}>
                      <option value="Frontend">Frontend</option>
                      <option value="Backend">Backend</option>
                      <option value="Database">Database</option>
                      <option value="API">API</option>
                      <option value="Authentication">Authentication</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>
                  <div className="form-group">
                    <label className="form-label">Priority *</label>
                    <select className="form-select" value={newPriority} onChange={(e) => setNewPriority(e.target.value)}>
                      <option value="Low">Low</option>
                      <option value="Medium">Medium</option>
                      <option value="High">High</option>
                    </select>
                  </div>
                  <div className="form-group">
                    <label className="form-label">Issue Description</label>
                    <textarea className="form-textarea" rows="4" placeholder="Describe what went wrong, steps to reproduce, or error messages..." value={newDesc} onChange={(e) => setNewDesc(e.target.value)} />
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '12px', marginTop: '20px' }}>
                    <button type="button" className="btn btn-secondary" onClick={() => setShowReportModal(false)}>Cancel</button>
                    <button type="submit" className="btn btn-primary">Submit Issue</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ISSUE DETAILS & AI PROBLEM SOLVER MODAL */}
          {selectedIssue && (
            <div className="modal-overlay">
              <div className="modal-box" style={{ maxWidth: '800px', maxHeight: '90vh', overflowY: 'auto' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '16px' }}>
                  <div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '6px' }}>
                      <span className="badge badge-cat">{selectedIssue.category || 'Backend'}</span>
                      <span className={`badge badge-${(selectedIssue.priority_name || 'medium').toLowerCase()}`}>
                        {selectedIssue.priority_name || 'Medium'}
                      </span>
                      <span className={`badge badge-${(selectedIssue.status_name || 'open').toLowerCase().replace(' ', '-')}`}>
                        {selectedIssue.status_name || 'Open'}
                      </span>
                    </div>
                    <h3 style={{ fontSize: '1.25rem', fontWeight: 800 }}>#{selectedIssue.issue_id}: {selectedIssue.title}</h3>
                    <div style={{ fontSize: '0.8rem', color: 'var(--text-secondary)', marginTop: '4px' }}>
                      Reported by {selectedIssue.reporter_name || 'User'} ({selectedIssue.reporter_email || ''})
                    </div>
                  </div>
                  <button className="btn btn-secondary btn-sm" onClick={() => setSelectedIssue(null)}><Icons.X /></button>
                </div>

                <div className="card" style={{ background: 'var(--bg-surface)', padding: '16px', marginBottom: '20px' }}>
                  <div style={{ fontSize: '0.8rem', fontWeight: 700, textTransform: 'uppercase', color: 'var(--text-secondary)', marginBottom: '4px' }}>Description</div>
                  <p style={{ fontSize: '0.92rem', color: 'var(--text-primary)' }}>{selectedIssue.description || 'No description provided.'}</p>
                </div>

                {/* AI SOLVE PROBLEM PROMINENT BUTTON */}
                <div style={{ margin: '20px 0', textAlign: 'center' }}>
                  <button className="btn btn-primary" style={{ padding: '12px 24px', fontSize: '1rem', width: '100%', justifyContent: 'center' }} onClick={handleAISolve} disabled={aiLoading}>
                    <Icons.Bot /> {aiLoading ? 'AI Analyzing Problem...' : 'AI Solve Problem'}
                  </button>
                </div>

                {/* AI SOLUTION DISPLAY PANEL */}
                {aiSolution && (
                  <div className="ai-box">
                    <div className="ai-box-title">
                      <Icons.Bot /> AI Problem Solver Diagnostics
                    </div>

                    {aiSolution.moreInfoRequired ? (
                      <div style={{ background: 'var(--warning-bg)', border: '1px solid var(--warning)', padding: '16px', borderRadius: 'var(--radius-md)', color: 'var(--warning)' }}>
                        <strong>More information is required to determine the exact cause.</strong>
                        <p style={{ marginTop: '6px', fontSize: '0.9rem' }}>{aiSolution.requiredDetails || 'Please add more diagnostic details or error logs.'}</p>
                      </div>
                    ) : (
                      <>
                        <div className="ai-section">
                          <div className="ai-section-label">Problem Understanding</div>
                          <div className="ai-section-content">{aiSolution.problemUnderstanding}</div>
                        </div>

                        <div className="ai-section">
                          <div className="ai-section-label">Possible Cause</div>
                          <div className="ai-section-content">{aiSolution.possibleCause}</div>
                        </div>

                        <div className="ai-section">
                          <div className="ai-section-label">Recommended Solution</div>
                          <div className="ai-section-content">{aiSolution.recommendedSolution}</div>
                        </div>

                        <div className="ai-section">
                          <div className="ai-section-label">Step-by-Step Fix</div>
                          <div className="ai-section-content">
                            {Array.isArray(aiSolution.stepByStepFix) ? (
                              aiSolution.stepByStepFix.map((step, sIdx) => <div key={sIdx} style={{ marginBottom: '4px' }}>{step}</div>)
                            ) : (
                              <div>{aiSolution.stepByStepFix}</div>
                            )}
                          </div>
                        </div>

                        {aiSolution.exampleCodeFix && (
                          <div className="ai-section">
                            <div className="ai-section-label">Example / Code Fix</div>
                            <pre className="code-block"><code>{aiSolution.exampleCodeFix}</code></pre>
                          </div>
                        )}

                        <div className="ai-section">
                          <div className="ai-section-label">Verification</div>
                          <div className="ai-section-content">{aiSolution.verification}</div>
                        </div>

                        <div className="ai-section">
                          <div className="ai-section-label">Prevention</div>
                          <div className="ai-section-content">{aiSolution.prevention}</div>
                        </div>

                        {/* USER SOLUTION CONFIRMATION BAR */}
                        <div style={{ borderTop: '1px solid var(--border)', paddingTop: '16px', marginTop: '20px' }}>
                          <div style={{ fontSize: '0.88rem', fontWeight: 700, marginBottom: '10px' }}>Did this AI solution solve your problem?</div>
                          <div style={{ display: 'flex', gap: '12px' }}>
                            <button className="btn btn-success" onClick={() => handleConfirmSolution(true)}>
                              <Icons.Check /> ✓ Problem Solved
                            </button>
                            <button className="btn btn-secondary" onClick={() => setShowStillNotSolvedInput(true)}>
                              <Icons.X /> ✕ Still Not Solved
                            </button>
                          </div>

                          {showStillNotSolvedInput && (
                            <div style={{ marginTop: '16px', background: 'var(--bg-surface-2)', padding: '16px', borderRadius: 'var(--radius-md)' }}>
                              <label className="form-label">Add Additional Diagnostic Information or Comment:</label>
                              <textarea className="form-textarea" rows="3" placeholder="Describe what happened when you tried the fix or paste new log output..." value={additionalNote} onChange={(e) => setAdditionalNote(e.target.value)} />
                              <div style={{ display: 'flex', gap: '10px', marginTop: '12px' }}>
                                <button className="btn btn-primary btn-sm" onClick={() => handleConfirmSolution(false)}>
                                  Submit Notes & Keep Open
                                </button>
                                <button className="btn btn-secondary btn-sm" onClick={handleAISolve} disabled={aiLoading}>
                                  <Icons.RefreshCw /> Re-analyze with AI
                                </button>
                              </div>
                            </div>
                          )}
                        </div>
                      </>
                    )}
                  </div>
                )}

                {/* RESOLUTION HISTORY TIMELINE */}
                <div style={{ marginTop: '24px' }}>
                  <div style={{ fontSize: '1rem', fontWeight: 700, marginBottom: '12px' }}>Resolution History</div>
                  {selectedIssue.history && selectedIssue.history.length > 0 ? (
                    <div className="timeline">
                      {selectedIssue.history.map((h, hIdx) => (
                        <div key={hIdx} className="timeline-item">
                          <div className="timeline-dot"></div>
                          <div className="timeline-event">{h.event_type}</div>
                          <div className="timeline-desc">{h.description}</div>
                          <div className="timeline-date">{h.created_at}</div>
                        </div>
                      ))}
                    </div>
                  ) : (
                    <div style={{ fontSize: '0.85rem', color: 'var(--text-muted)' }}>Issue history recorded upon activity.</div>
                  )}
                </div>

                <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: '24px' }}>
                  <button className="btn btn-secondary" onClick={() => setSelectedIssue(null)}>Close</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
