<head>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>

  <style>
    /* ============================================================
       CLEAN PROFESSIONAL DESIGN SYSTEM (LIGHT & DARK THEME TOKENS)
       ============================================================ */
    :root, [data-theme="light"] {
      --bg-base: #F8FAFC;
      --bg-surface: #FFFFFF;
      --bg-surface-2: #F1F5F9;
      --bg-card: #FFFFFF;
      --bg-hover: #F8FAFC;

      --text-primary: #0F172A;
      --text-secondary: #64748B;
      --text-muted: #94A3B8;

      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --primary-light: #EFF6FF;

      --success: #16A34A;
      --success-bg: #DCFCE7;
      --success-text: #15803D;

      --warning: #D97706;
      --warning-bg: #FEF3C7;
      --warning-text: #B45309;

      --danger: #DC2626;
      --danger-bg: #FEE2E2;
      --danger-text: #B91C1C;

      --neutral-badge-bg: #F1F5F9;
      --neutral-badge-text: #475569;

      --border: #E2E8F0;
      --border-dark: #CBD5E1;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);

      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    [data-theme="dark"] {
      --bg-base: #0F172A;
      --bg-surface: #111827;
      --bg-surface-2: #1E293B;
      --bg-card: #111827;
      --bg-hover: #1F2937;

      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;

      --primary: #3B82F6;
      --primary-hover: #2563EB;
      --primary-light: rgba(59, 130, 246, 0.12);

      --success: #22C55E;
      --success-bg: rgba(34, 197, 94, 0.15);
      --success-text: #4ADE80;

      --warning: #F59E0B;
      --warning-bg: rgba(245, 158, 11, 0.15);
      --warning-text: #FBBF24;

      --danger: #EF4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --danger-text: #F87171;

      --neutral-badge-bg: rgba(148, 163, 184, 0.15);
      --neutral-badge-text: #94A3B8;

      --border: #1E293B;
      --border-dark: #334155;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.2);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: var(--border-dark); border-radius: 999px; }

    /* Layout Structure */
    .app-layout {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 240px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .sidebar-brand {
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--primary);
      border-bottom: 1px solid var(--border);
      text-decoration: none;
    }

    .sidebar-nav {
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      user-select: none;
    }

    .nav-item:hover {
      background: var(--bg-surface-2);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
      border-color: rgba(37, 99, 235, 0.2);
    }

    .sidebar-footer {
      padding: 16px 12px;
      border-top: 1px solid var(--border);
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg-base);
    }

    .top-header {
      height: 60px;
      padding: 0 24px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .page-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .content-area {
      padding: 24px;
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    /* Clean Card Component */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    /* Metric Cards Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      box-shadow: var(--shadow-sm);
    }

    .metric-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .metric-val {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-top: 4px;
    }

    /* Table System */
    .table-container {
      width: 100%;
      overflow-x: auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
      text-align: left;
    }

    th {
      background: var(--bg-surface-2);
      color: var(--text-secondary);
      font-weight: 600;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: var(--bg-hover);
    }

    /* Semantic Status & Priority Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1.4;
      white-space: nowrap;
    }

    .badge-open {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid rgba(37, 99, 235, 0.2);
    }

    .badge-in-progress {
      background: var(--warning-bg);
      color: var(--warning-text);
      border: 1px solid rgba(217, 119, 6, 0.2);
    }

    .badge-resolved {
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid rgba(22, 163, 74, 0.2);
    }

    .badge-closed {
      background: var(--neutral-badge-bg);
      color: var(--neutral-badge-text);
      border: 1px solid var(--border);
    }

    .badge-high {
      background: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid rgba(220, 38, 38, 0.2);
    }

    .badge-medium {
      background: var(--warning-bg);
      color: var(--warning-text);
      border: 1px solid rgba(217, 119, 6, 0.2);
    }

    .badge-low {
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid rgba(22, 163, 74, 0.2);
    }

    /* Form & Input Controls */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 0.875rem;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      user-select: none;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 0.8rem;
    }

    .btn-primary {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--bg-surface-2);
      color: var(--text-primary);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg-hover);
      border-color: var(--border-dark);
    }

    .btn-danger {
      background: var(--danger);
      color: #FFFFFF;
      border-color: var(--danger);
    }

    .theme-toggle-btn {
      background: var(--bg-surface-2);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-weight: 600;
      font-size: 0.85rem;
      padding: 6px 12px;
      border-radius: var(--radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .theme-toggle-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 100%;
      max-width: 520px;
      box-shadow: var(--shadow-md);
    }

    /* Mobile Responsive Controls */
    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .app-layout {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .mobile-menu-btn {
        display: block;
      }
      .sidebar-nav {
        display: none;
      }
      .sidebar.open .sidebar-nav {
        display: flex;
      }
      .content-area {
        padding: 16px;
      }
    }
  </style>
</head>

        localStorage.setItem('trackflow_theme', theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => prev === 'light' ? 'dark' : 'light');
      };

      // Entities State
      const [projects, setProjects] = useState(SEED_PROJECTS);
      const [members, setMembers] = useState(SEED_MEMBERS);
      const [issues, setIssues] = useState(SEED_ISSUES);
      const [users, setUsers] = useState(SEED_USERS);
      const [comments, setComments] = useState(SEED_COMMENTS);

      // Selected Items for Details
      const [selectedProjectId, setSelectedProjectId] = useState(1);
      const [selectedIssueId, setSelectedIssueId] = useState(101);

      // Search & Filter State
      const [issueSearch, setIssueSearch] = useState('');
      const [filterProject, setFilterProject] = useState('ALL');
      const [filterPriority, setFilterPriority] = useState('ALL');
      const [filterStatus, setFilterStatus] = useState('ALL');
      const [filterAssignee, setFilterAssignee] = useState('ALL');

      // Modals State
      const [showCreateProjectModal, setShowCreateProjectModal] = useState(false);
      const [showReportIssueModal, setShowReportIssueModal] = useState(false);
      const [showAddMemberModal, setShowAddMemberModal] = useState(false);
      const [showAddUserModal, setShowAddUserModal] = useState(false);
      const [showLogoutModal, setShowLogoutModal] = useState(false);

      // Form Inputs State
      const [newProjName, setNewProjName] = useState('');
      const [newProjDesc, setNewProjDesc] = useState('');
      const [newProjStart, setNewProjStart] = useState('');
      const [newProjDeadline, setNewProjDeadline] = useState('');
      const [newProjStatus, setNewProjStatus] = useState('Open');

      const [newIssueProjId, setNewIssueProjId] = useState(1);
      const [newIssueTitle, setNewIssueTitle] = useState('');
      const [newIssueDesc, setNewIssueDesc] = useState('');
      const [newIssueAssignee, setNewIssueAssignee] = useState(2);
      const [newIssuePriority, setNewIssuePriority] = useState('Medium');
      const [newIssueStatus, setNewIssueStatus] = useState('Open');
      const [newIssueDueDate, setNewIssueDueDate] = useState('');

      const [newMemberUserId, setNewMemberUserId] = useState(2);
      const [newMemberRole, setNewMemberRole] = useState('Developer');

      const [newUserName, setNewUserName] = useState('');
      const [newUserEmail, setNewUserEmail] = useState('');
      const [newUserPhone, setNewUserPhone] = useState('');
      const [newUserRole, setNewUserRole] = useState('USER');

      const [newCommentText, setNewCommentText] = useState('');

      // AI Feature State
      const [aiAnalysisResult, setAiAnalysisResult] = useState(null);
      const [aiAnalysisLoading, setAiAnalysisLoading] = useState(false);
      const [aiIssueSummaryResult, setAiIssueSummaryResult] = useState(null);
      const [aiIssueSummaryLoading, setAiIssueSummaryLoading] = useState(false);
      const [aiProjectSummaryResult, setAiProjectSummaryResult] = useState(null);
      const [aiProjectSummaryLoading, setAiProjectSummaryLoading] = useState(false);
      const [helpfulMarked, setHelpfulMarked] = useState(false);

      useEffect(() => {
        setAiAnalysisResult(null);
        setAiIssueSummaryResult(null);
        setHelpfulMarked(false);
      }, [selectedIssueId]);

      useEffect(() => {
        setAiProjectSummaryResult(null);
      }, [selectedProjectId]);

      // Helpers
      const getUserName = (id) => {
        const u = users.find(u => u.userId === parseInt(id));
        return u ? u.name : 'Unassigned';
      };
      const getProjectName = (id) => {
        const p = projects.find(p => p.projectId === parseInt(id));
        return p ? p.projectName : 'Unknown';
      };
      const getProjectMembersCount = (pId) => {
        return members.filter(m => m.projectId === pId).length;
      };
      const getProjectIssuesCount = (pId) => {
        return issues.filter(i => i.projectId === pId).length;
      };

      // AI Handlers
      const handleAnalyzeIssue = async () => {
        if (!selectedIssue) return;
        setAiAnalysisLoading(true);
        setHelpfulMarked(false);
        try {
          const res = await fetch(`${API_BASE_URL}/ai/analyze-issue`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              title: selectedIssue.title,
              description: selectedIssue.description,
              projectName: getProjectName(selectedIssue.projectId),
              assignedTo: getUserName(selectedIssue.assignedToId),
              priority: selectedIssue.priority,
              status: selectedIssue.status,
              dueDate: selectedIssue.dueDate,
              comments: selectedIssueComments
            })
          });
          const data = await res.json();
          if (data.success && data.analysis) {
            setAiAnalysisResult(data.analysis);
          } else {
            alert(data.message || 'AI Analysis could not be completed.');
          }
        } catch (err) {
          console.error('Error analyzing issue:', err);
          alert('Could not connect to AI server backend.');
        } finally {
          setAiAnalysisLoading(false);
        }
      };

      const handleGenerateIssueSummary = async () => {
        if (!selectedIssue) return;
        setAiIssueSummaryLoading(true);
        try {
          const res = await fetch(`${API_BASE_URL}/ai/summarize-issue`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              title: selectedIssue.title,
              description: selectedIssue.description,
              comments: selectedIssueComments
            })
          });
          const data = await res.json();
          if (data.success && data.summary) {
            setAiIssueSummaryResult(data.summary);
          } else {
            alert(data.message || 'AI Issue Summary could not be generated.');
          }
        } catch (err) {
          console.error('Error generating issue summary:', err);
          alert('Could not connect to AI server backend.');
        } finally {
          setAiIssueSummaryLoading(false);
        }
      };

      const handleGenerateProjectSummary = async () => {
        if (!selectedProject) return;
        setAiProjectSummaryLoading(true);
        const projectIssues = issues.filter(i => i.projectId === selectedProject.projectId);
        try {
          const res = await fetch(`${API_BASE_URL}/ai/summarize-project`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              projectName: selectedProject.projectName,
              description: selectedProject.description,
              status: selectedProject.status,
              startDate: selectedProject.startDate,
              deadline: selectedProject.deadline,
              totalIssues: projectIssues.length,
              openIssues: projectIssues.filter(i => i.status === 'Open' || i.status === 'In Progress').length,
              resolvedIssues: projectIssues.filter(i => i.status === 'Resolved' || i.status === 'Closed').length,
              highPriorityIssues: projectIssues.filter(i => i.priority === 'High').length,
              issues: projectIssues
            })
          });
          const data = await res.json();
          if (data.success && data.summary) {
            setAiProjectSummaryResult(data.summary);
          } else {
            alert(data.message || 'AI Project Summary could not be generated.');
          }
        } catch (err) {
          console.error('Error generating project summary:', err);
          alert('Could not connect to AI server backend.');
        } finally {
          setAiProjectSummaryLoading(false);
        }
      };

      // CRUD Handlers
      const handleCreateProject = (e) => {
        e.preventDefault();
        if (!newProjName.trim()) return;
        const newProj = {
          projectId: Date.now(),
          projectName: newProjName.trim(),
          description: newProjDesc,
          startDate: newProjStart || new Date().toISOString().split('T')[0],
          deadline: newProjDeadline || '2026-12-31',
          status: newProjStatus
        };
        setProjects([newProj, ...projects]);
        setShowCreateProjectModal(false);
        setNewProjName(''); setNewProjDesc('');
      };

      const handleReportIssue = (e) => {
        e.preventDefault();
        if (!newIssueTitle.trim()) return;
        const newIss = {
          issueId: Math.floor(100 + Math.random() * 900),
          projectId: parseInt(newIssueProjId),
          title: newIssueTitle.trim(),
          description: newIssueDesc,
          assignedToId: parseInt(newIssueAssignee),
          priority: newIssuePriority,
          status: newIssueStatus,
          dueDate: newIssueDueDate || '2026-12-31'
        };
        setIssues([newIss, ...issues]);
        setShowReportIssueModal(false);
        setNewIssueTitle(''); setNewIssueDesc('');
      };

      const handleAddMember = (e) => {
        e.preventDefault();
        const existing = members.find(m => m.projectId === selectedProjectId && m.userId === parseInt(newMemberUserId));
        if (existing) {
          alert('User is already a member of this project.');
          return;
        }
        const newM = {
          projectId: selectedProjectId,
          userId: parseInt(newMemberUserId),
          role: newMemberRole,
          joinedDate: new Date().toISOString().split('T')[0]
        };
        setMembers([...members, newM]);
        setShowAddMemberModal(false);
      };

      const handleAddUser = (e) => {
        e.preventDefault();
        if (!newUserName.trim() || !newUserEmail.trim()) return;
        const newU = {
          userId: Date.now(),
          name: newUserName.trim(),
          email: newUserEmail.trim(),
          phone: newUserPhone || '+91-9000000000',
          role: newUserRole
        };
        setUsers([...users, newU]);
        setShowAddUserModal(false);
        setNewUserName(''); setNewUserEmail('');
      };

      const handleAddComment = (e) => {
        e.preventDefault();
        if (!newCommentText.trim()) return;
        const newC = {
          commentId: Date.now(),
          issueId: selectedIssueId,
          userId: 1,
          commentText: newCommentText.trim(),
          createdDate: new Date().toLocaleString()
        };
        setComments([...comments, newC]);
        setNewCommentText('');
      };

      const handleUpdateIssue = (field, val) => {
        setIssues(issues.map(i => {
          if (i.issueId === selectedIssueId) {
            return { ...i, [field]: val };
          }
          return i;
        }));
      };

      // Filtered Issues List
      const filteredIssues = issues.filter(i => {
        const matchesSearch = !issueSearch.trim() || 
          i.issueId.toString().includes(issueSearch.trim()) || 
          i.title.toLowerCase().includes(issueSearch.toLowerCase());
        const matchesProject = filterProject === 'ALL' || i.projectId === parseInt(filterProject);
        const matchesPriority = filterPriority === 'ALL' || i.priority === filterPriority;
        const matchesStatus = filterStatus === 'ALL' || i.status === filterStatus;
        const matchesAssignee = filterAssignee === 'ALL' || i.assignedToId === parseInt(filterAssignee);
        return matchesSearch && matchesProject && matchesPriority && matchesStatus && matchesAssignee;
      });

      const selectedProject = projects.find(p => p.projectId === selectedProjectId) || projects[0];
      const selectedIssue = issues.find(i => i.issueId === selectedIssueId) || issues[0];
      const selectedIssueComments = comments.filter(c => c.issueId === selectedIssueId);

      const getStatusBadgeClass = (st) => {
        switch(st) {
          case 'Open': return 'badge-open';
          case 'In Progress': return 'badge-in-progress';
          case 'Resolved': return 'badge-resolved';
          case 'Closed': return 'badge-closed';
          default: return 'badge-open';
        }
      };

      const getPriorityBadgeClass = (pr) => {
        switch(pr) {
          case 'High': return 'badge-high';
          case 'Medium': return 'badge-medium';
          case 'Low': return 'badge-low';
          default: return 'badge-medium';
        }
      };

      return (
        <div className="app-layout">
          {/* SIDEBAR NAVIGATION */}
          <aside className={`sidebar ${mobileNavOpen ? 'open' : ''}`}>
            <a href="#" className="sidebar-brand">
              <Icons.Database /> TrackFlow
            </a>

            <nav className="sidebar-nav">
              <div 
                className={`nav-item ${activeTab === 'dashboard' ? 'active' : ''}`}
                onClick={() => { setActiveTab('dashboard'); setMobileNavOpen(false); }}
              >
                <Icons.Kanban /> Dashboard
              </div>
              <div 
                className={`nav-item ${activeTab === 'projects' || activeTab === 'project-details' ? 'active' : ''}`}
                onClick={() => { setActiveTab('projects'); setMobileNavOpen(false); }}
              >
                <Icons.Database /> Projects
              </div>
              <div 
                className={`nav-item ${activeTab === 'issues' || activeTab === 'issue-details' ? 'active' : ''}`}
                onClick={() => { setActiveTab('issues'); setMobileNavOpen(false); }}
              >
                <Icons.Bug /> Issues
              </div>
              <div 
                className={`nav-item ${activeTab === 'members' ? 'active' : ''}`}
                onClick={() => { setActiveTab('members'); setMobileNavOpen(false); }}
              >
                <Icons.Users /> Team Members
              </div>
              <div 
                className={`nav-item ${activeTab === 'reports' ? 'active' : ''}`}
                onClick={() => { setActiveTab('reports'); setMobileNavOpen(false); }}
              >
                <Icons.Report /> DBMS Reports
              </div>
              <div 
                className={`nav-item ${activeTab === 'profile' ? 'active' : ''}`}
                onClick={() => { setActiveTab('profile'); setMobileNavOpen(false); }}
              >
                <Icons.User /> Profile
              </div>
            </nav>

            <div className="sidebar-footer">
              <button 
                className="nav-item" 
                style={{ width: '100%', color: 'var(--danger)', border: 'none', background: 'none' }}
                onClick={() => setShowLogoutModal(true)}
              >
                <Icons.LogOut /> Logout
              </button>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main className="main-content">
            <header className="top-header">
              <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                <button className="mobile-menu-btn" onClick={() => setMobileNavOpen(!mobileNavOpen)}>
                  <Icons.Menu />
                </button>
                <h1 className="page-title">
                  {activeTab === 'dashboard' && 'Dashboard'}
                  {activeTab === 'projects' && 'Software Projects'}
                  {activeTab === 'project-details' && `Project Details — ${selectedProject?.projectName}`}
                  {activeTab === 'issues' && 'Issue & Bug Tracker'}
                  {activeTab === 'issue-details' && `Issue Details — #${selectedIssue?.issueId}`}
                  {activeTab === 'members' && 'Team Members & User Directory'}
                  {activeTab === 'reports' && 'DBMS Relational Reports'}
                  {activeTab === 'profile' && 'User Profile'}
                </h1>
              </div>

              <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                <button 
                  className="theme-toggle-btn"
                  onClick={toggleTheme}
                  title="Toggle Light/Dark Theme"
                >
                  {theme === 'light' ? <><Icons.Moon /> Dark</> : <><Icons.Sun /> Light</>}
                </button>

                <button className="btn btn-primary btn-sm" onClick={() => setShowReportIssueModal(true)}>
                  <Icons.Plus /> Report Issue
                </button>
              </div>
            </header>

            <div className="content-area">
              {/* 1. DASHBOARD TAB */}
              {activeTab === 'dashboard' && (
                <div>
                  <div className="metrics-grid">
                    <div className="metric-card">
                      <div className="metric-label">Total Projects</div>
                      <div className="metric-val">{projects.length}</div>
                    </div>
                    <div className="metric-card">
                      <div className="metric-label">Total Issues</div>
                      <div className="metric-val">{issues.length}</div>
                    </div>
                    <div className="metric-card">
                      <div className="metric-label">Open Issues</div>
                      <div className="metric-val" style={{ color: 'var(--warning-text)' }}>
                        {issues.filter(i => i.status === 'Open' || i.status === 'In Progress').length}
                      </div>
                    </div>
                    <div className="metric-card">
                      <div className="metric-label">Resolved Issues</div>
                      <div className="metric-val" style={{ color: 'var(--success-text)' }}>
                        {issues.filter(i => i.status === 'Resolved' || i.status === 'Closed').length}
                      </div>
                    </div>
                  </div>

                  <div className="card">
                    <div className="card-header">
                      <h2 className="card-title">Recent Issues</h2>
                      <button className="btn btn-secondary btn-sm" onClick={() => setActiveTab('issues')}>View All Issues</button>
                    </div>
                    <div className="table-container">
                      <table>
                        <thead>
                          <tr>
                            <th>Issue ID</th>
                            <th>Issue Title</th>
                            <th>Project</th>
                            <th>Assigned Member</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Due Date</th>
                          </tr>
                        </thead>
                        <tbody>
                          {issues.slice(0, 5).map(issue => (
                            <tr 
                              key={issue.issueId} 
                              style={{ cursor: 'pointer' }}
                              onClick={() => { setSelectedIssueId(issue.issueId); setActiveTab('issue-details'); }}
                            >
                              <td style={{ fontFamily: 'var(--font-mono)', fontWeight: 700 }}>#{issue.issueId}</td>
                              <td style={{ fontWeight: 600 }}>{issue.title}</td>
                              <td>{getProjectName(issue.projectId)}</td>
                              <td>{getUserName(issue.assignedToId)}</td>
                              <td><span className={`badge ${getPriorityBadgeClass(issue.priority)}`}>{issue.priority}</span></td>
                              <td><span className={`badge ${getStatusBadgeClass(issue.status)}`}>{issue.status}</span></td>
                              <td>{issue.dueDate}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* 2. PROJECTS TAB */}
              {activeTab === 'projects' && (
                <div>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                    <p style={{ color: 'var(--text-secondary)', fontSize: '0.9rem' }}>Relational `PROJECT` records in the system</p>
                    <button className="btn btn-primary btn-sm" onClick={() => setShowCreateProjectModal(true)}>
                      <Icons.Plus /> Create Project
                    </button>
                  </div>

                  <div className="table-container">
                    <table>
                      <thead>
                        <tr>
                          <th>Project ID</th>
                          <th>Project Name</th>
                          <th>Description</th>
                          <th>Start Date</th>
                          <th>Deadline</th>
                          <th>Status</th>
                          <th>Members</th>
                          <th>Issues</th>
                          <th>Actions</th>
                        </tr>
                      </thead>
                      <tbody>
                        {projects.map(proj => (
                          <tr key={proj.projectId}>
                            <td style={{ fontFamily: 'var(--font-mono)', fontWeight: 700 }}>#{proj.projectId}</td>
                            <td style={{ fontWeight: 700, color: 'var(--primary)' }}>{proj.projectName}</td>
                            <td style={{ maxWidth: '280px', color: 'var(--text-secondary)' }}>{proj.description}</td>
                            <td>{proj.startDate}</td>
                            <td>{proj.deadline}</td>
                            <td><span className={`badge ${getStatusBadgeClass(proj.status)}`}>{proj.status}</span></td>
                            <td style={{ fontWeight: 600 }}>{getProjectMembersCount(proj.projectId)}</td>
                            <td style={{ fontWeight: 600 }}>{getProjectIssuesCount(proj.projectId)}</td>
                            <td>
                              <button 
                                className="btn btn-secondary btn-sm"
                                onClick={() => { setSelectedProjectId(proj.projectId); setActiveTab('project-details'); }}
                              >
                                View Details
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* 3. PROJECT DETAILS TAB */}
              {activeTab === 'project-details' && selectedProject && (
                <div>
                  <div className="card">
                    <div className="card-header" style={{ flexWrap: 'wrap', gap: '12px' }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                        <h2 className="card-title">Project Information</h2>
                        <span className={`badge ${getStatusBadgeClass(selectedProject.status)}`}>
                          {selectedProject.status}
                        </span>
                      </div>
                      <button 
                        className="btn btn-primary btn-sm" 
                        onClick={handleGenerateProjectSummary}
                        disabled={aiProjectSummaryLoading}
                      >
                        <Icons.Sparkles /> {aiProjectSummaryLoading ? 'Generating Summary...' : 'Generate Project Summary'}
                      </button>
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '16px' }}>
                      <div>
                        <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>Project ID</div>
                        <div style={{ fontWeight: 700, fontFamily: 'var(--font-mono)' }}>#{selectedProject.projectId}</div>
                      </div>
                      <div>
                        <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>Project Name</div>
                        <div style={{ fontWeight: 700 }}>{selectedProject.projectName}</div>
                      </div>
                      <div>
                        <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>Start Date</div>
                        <div>{selectedProject.startDate}</div>
                      </div>
                      <div>
                        <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>Deadline</div>
                        <div>{selectedProject.deadline}</div>
                      </div>
                    </div>
                    <div style={{ marginTop: '16px', color: 'var(--text-secondary)' }}>
                      <strong>Description:</strong> {selectedProject.description}
                    </div>
                  </div>

                  {/* AI Project Summary Section */}
                  {aiProjectSummaryResult && (
                    <div className="card" style={{ borderLeft: '4px solid var(--primary)', background: 'var(--primary-light)' }}>
                      <div className="card-header" style={{ marginBottom: '8px' }}>
                        <h3 className="card-title" style={{ display: 'flex', alignItems: 'center', gap: '8px', color: 'var(--primary)' }}>
                          <Icons.Sparkles /> AI Project Summary
                        </h3>
                      </div>
                      <p style={{ color: 'var(--text-primary)', whiteSpace: 'pre-line', lineHeight: '1.6', fontSize: '0.9rem' }}>
                        {aiProjectSummaryResult}
                      </p>
                    </div>
                  )}

                  {/* Team Members Section */}
                  <div className="card">
                    <div className="card-header">
                      <h3 className="card-title">Team Members (PROJECT_MEMBER)</h3>
                      <button className="btn btn-secondary btn-sm" onClick={() => setShowAddMemberModal(true)}>
                        <Icons.Plus /> Add Member
                      </button>
                    </div>
                    <div className="table-container">
                      <table>
                        <thead>
                          <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Joined Date</th>
                          </tr>
                        </thead>
                        <tbody>
                          {members.filter(m => m.projectId === selectedProjectId).map(m => {
                            const u = users.find(user => user.userId === m.userId);
                            return (
                              <tr key={m.userId}>
                                <td style={{ fontWeight: 600 }}>{u ? u.name : 'Unknown User'}</td>
                                <td>{u ? u.email : '-'}</td>
                                <td style={{ fontWeight: 600, color: 'var(--primary)' }}>{m.role}</td>
                                <td>{m.joinedDate}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  {/* Project Issues Section */}
                  <div className="card">
                    <div className="card-header">
                      <h3 className="card-title">Project Issues (ISSUE)</h3>
                      <button className="btn btn-primary btn-sm" onClick={() => { setNewIssueProjId(selectedProjectId); setShowReportIssueModal(true); }}>
                        <Icons.Plus /> Report Issue
                      </button>
                    </div>
                    <div className="table-container">
                      <table>
                        <thead>
                          <tr>
                            <th>Issue ID</th>
                            <th>Title</th>
                            <th>Assigned Member</th>
                            <th>Priority</th>
                            <th>Status</th>
                            <th>Due Date</th>
                          </tr>
                        </thead>
                        <tbody>
                          {issues.filter(i => i.projectId === selectedProjectId).map(issue => (
                            <tr 
                              key={issue.issueId} 
                              style={{ cursor: 'pointer' }}
                              onClick={() => { setSelectedIssueId(issue.issueId); setActiveTab('issue-details'); }}
                            >
                              <td style={{ fontFamily: 'var(--font-mono)', fontWeight: 700 }}>#{issue.issueId}</td>
                              <td style={{ fontWeight: 600 }}>{issue.title}</td>
                              <td>{getUserName(issue.assignedToId)}</td>
                              <td><span className={`badge ${getPriorityBadgeClass(issue.priority)}`}>{issue.priority}</span></td>
                              <td><span className={`badge ${getStatusBadgeClass(issue.status)}`}>{issue.status}</span></td>
                              <td>{issue.dueDate}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* 4. ISSUES TAB */}
              {activeTab === 'issues' && (

                  <div className="form-group">
                    <label className="form-label">Project Role</label>
                    <input type="text" className="form-input" value={newMemberRole} onChange={(e) => setNewMemberRole(e.target.value)} placeholder="e.g. Developer, QA" />
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '12px', marginTop: '20px' }}>
                    <button type="button" className="btn btn-secondary" onClick={() => setShowAddMemberModal(false)}>Cancel</button>
                    <button type="submit" className="btn btn-primary">Add Member</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADD USER MODAL */}
          {showAddUserModal && (
            <div className="modal-overlay">
              <div className="modal-box">
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '16px' }}>
                  <h3 style={{ fontSize: '1.1rem', fontWeight: 700 }}>Add System User</h3>
                  <button className="btn btn-secondary btn-sm" onClick={() => setShowAddUserModal(false)}><Icons.X /></button>
                </div>
                <form onSubmit={handleAddUser}>
                  <div className="form-group">
                    <label className="form-label">Full Name *</label>
                    <input type="text" className="form-input" required value={newUserName} onChange={(e) => setNewUserName(e.target.value)} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Email Address *</label>
                    <input type="email" className="form-input" required value={newUserEmail} onChange={(e) => setNewUserEmail(e.target.value)} />
                  </div>
                  <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '12px', marginTop: '20px' }}>
                    <button type="button" className="btn btn-secondary" onClick={() => setShowAddUserModal(false)}>Cancel</button>
                    <button type="submit" className="btn btn-primary">Add User</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* LOGOUT CONFIRMATION MODAL */}
          {showLogoutModal && (
            <div className="modal-overlay">
              <div className="modal-box">
                <h3 style={{ fontSize: '1.1rem', fontWeight: 700, marginBottom: '8px' }}>Confirm Logout</h3>
                <p style={{ color: 'var(--text-secondary)', fontSize: '0.9rem', marginBottom: '20px' }}>
                  Are you sure you want to log out of TrackFlow?
                </p>
                <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '12px' }}>
                  <button className="btn btn-secondary" onClick={() => setShowLogoutModal(false)}>Cancel</button>
                  <button className="btn btn-danger" onClick={() => { setShowLogoutModal(false); alert('Successfully logged out.'); }}>Logout</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
